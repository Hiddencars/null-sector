<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>НОЛЬ-СЕКТОР · экшен-гача</title>
<style>
/* ============================================================
   НОЛЬ-СЕКТОР — визуальный слой в стиле ZZZ
   ============================================================ */
:root{
  --bg:#0a0a0d;
  --bg2:#101116;
  --panel:#15171e;
  --panel2:#1c1f28;
  --panel3:#242835;
  --line:#2e3342;
  --lime:#c8ff1e;
  --lime-d:#93c000;
  --yellow:#ffe600;
  --red:#ff3b30;
  --mag:#ff2e88;
  --cyan:#22e0ff;
  --violet:#a86bff;
  --ink:#f4f6fa;
  --dim:#8b91a3;
  --dim2:#5d6376;
  --fire:#ff4d1a;
  --ice:#4fd8ff;
  --elec:#a86bff;
  --ether:#ffe14d;
  --phys:#cfd8e6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Inter",system-ui,-apple-system,sans-serif;
  user-select:none;cursor:default}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;
  image-rendering:auto;background:#07070a}
.hidden{display:none!important}

/* ---------- типографика ---------- */
.hd{font-family:"Impact","Haettenschweiler","Arial Narrow",sans-serif;
  letter-spacing:.5px;text-transform:uppercase;font-weight:400;line-height:.92}
.mono{font-family:Consolas,"Cascadia Mono",monospace;font-variant-numeric:tabular-nums}
.skew{transform:skewX(-8deg)}
.tag{display:inline-block;padding:2px 7px;font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;background:var(--panel3);color:var(--dim);border-radius:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#hud>*{pointer-events:none}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  align-items:flex-start;padding:14px 18px;gap:14px}
.team{display:flex;flex-direction:column;gap:6px}
.tm-c{position:relative;display:flex;align-items:center;gap:8px;width:186px;
  background:linear-gradient(90deg,rgba(21,23,30,.94),rgba(21,23,30,.55));
  border-left:3px solid var(--line);padding:5px 8px 5px 5px;
  clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:.18s}
.tm-c.active{border-left-color:var(--lime);background:linear-gradient(90deg,rgba(200,255,30,.16),rgba(21,23,30,.5))}
.tm-c.dead{opacity:.34;filter:grayscale(1)}
.tm-av{width:34px;height:34px;flex:0 0 34px;border-radius:3px;overflow:hidden;
  background:#0c0d12;border:1px solid var(--line);position:relative}
.tm-av svg{width:100%;height:100%;display:block}
.tm-meta{flex:1;min-width:0}
.tm-name{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#dfe4ee;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-name b{color:var(--lime);font-weight:700}
.bar{height:4px;background:#000;margin-top:4px;border-radius:2px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),#7cffb2);
  transition:width .15s linear}
.bar.hp>i{background:linear-gradient(90deg,#3ef08a,#1fd0ff)}
.bar.daze>i{background:linear-gradient(90deg,#ffb300,#ff6a00)}
.tm-key{position:absolute;top:2px;right:8px;font-size:9px;color:var(--dim2);
  font-family:Consolas,monospace}

.res{display:flex;gap:8px;align-items:flex-start}
.pill{display:flex;align-items:center;gap:7px;background:rgba(14,15,20,.92);
  border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 9px;font-size:12px}
.pill .ico{width:16px;height:16px;display:grid;place-items:center;font-size:11px}
.pill .pl{color:var(--dim);font-size:10px;letter-spacing:1px}
.pill .v{font-family:Consolas,monospace;font-size:12.5px;letter-spacing:.5px}
.pill.eth .ico{color:var(--yellow)}
.pill.cre .ico{color:#bfc9d8}
.pill.sp  .ico{color:var(--lime)}

.hud-bottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  display:flex;gap:16px;align-items:flex-end}
.act{position:relative;display:grid;place-items:center;width:58px;height:58px;
  background:radial-gradient(circle at 50% 40%,#22262f,#0e1015);
  border:2px solid #333a4a;border-radius:50%;font-size:11px;letter-spacing:1px;
  color:#9aa2b5;transition:.12s}
.act.ready{border-color:var(--lime);color:var(--lime);box-shadow:0 0 14px rgba(200,255,30,.3)}
.act .k{position:absolute;bottom:-15px;font-size:10px;letter-spacing:1.2px;color:#a2abbd;
  font-family:Consolas,monospace}
.act .cd{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(rgba(0,0,0,.72) var(--p,0deg),transparent 0);pointer-events:none}
.act .cdt{position:absolute;font-family:Consolas,monospace;font-size:13px;color:#fff}
.act.big{width:74px;height:74px;border-color:#4a4152}
.act.ult.on{border-color:var(--yellow);color:var(--yellow);
  box-shadow:0 0 24px rgba(255,230,0,.5),inset 0 0 20px rgba(255,230,0,.18);animation:ultPulse 1.1s infinite}
@keyframes ultPulse{0%,100%{box-shadow:0 0 18px rgba(255,230,0,.35)}50%{box-shadow:0 0 34px rgba(255,230,0,.72)}}

.combo{position:absolute;right:34px;top:45%;text-align:right;transform:translateY(-50%)}
.combo .n{font-family:Impact,sans-serif;font-size:56px;line-height:.85;color:var(--yellow);
  text-shadow:0 0 22px rgba(255,210,0,.6),3px 3px 0 #000}
.combo .l{font-size:10px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
.combo .m{font-family:Consolas,monospace;font-size:13px;color:var(--lime)}

#minimap{position:absolute;right:18px;bottom:18px;width:184px;height:184px;
  background:rgba(8,9,12,.8);border:1px solid var(--line);
  clip-path:polygon(0 0,100% 0,100% 88%,88% 100%,0 100%)}
#quest{position:absolute;left:18px;bottom:18px;width:280px;background:rgba(10,11,15,.82);
  border-left:2px solid var(--yellow);padding:8px 12px;font-size:11.5px;line-height:1.5}
#quest .qt{font-size:10px;letter-spacing:2px;color:var(--yellow);text-transform:uppercase;margin-bottom:3px}
#quest .qo{color:var(--dim)}
#quest .qd{color:#e6ebf5}
#toasts{position:absolute;top:76px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:6px;align-items:center;width:560px}
.toast{background:rgba(10,11,15,.92);border-left:3px solid var(--lime);padding:7px 16px;
  font-size:13px;letter-spacing:.4px;animation:toastIn .3s ease;box-shadow:0 6px 22px #0009}
.toast.warn{border-left-color:var(--red)}
.toast.gold{border-left-color:var(--yellow)}
@keyframes toastIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

.pop-hint{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);
  font-size:12px;letter-spacing:1px;color:var(--dim);background:rgba(8,9,12,.7);
  padding:5px 14px;border-radius:99px}

/* ---------- экраны ---------- */
#screens{position:fixed;inset:0;z-index:40;pointer-events:none}
#screens>.scr{pointer-events:auto}
.scr{position:absolute;inset:0;background:rgba(6,7,10,.9);backdrop-filter:blur(7px);
  display:flex;flex-direction:column;animation:fadeIn .18s ease;overflow:hidden}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.scr::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:5px 5px}
.scr-head{display:flex;align-items:center;gap:12px;padding:16px 22px;flex:0 0 auto;z-index:3}
.back{width:44px;height:34px;background:var(--red);border:0;color:#fff;font-size:17px;
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%,10% 50%);cursor:pointer;
  display:grid;place-items:center;transition:.14s}
.back:hover{filter:brightness(1.18)}
.home{width:40px;height:34px;background:#0d0e12;border:1px solid var(--line);color:#cfd6e2;
  border-radius:99px;cursor:pointer;font-size:13px;transition:.14s}
.home:hover{border-color:var(--lime);color:var(--lime)}
.crumb{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#c9d1de}

/* ---------- дерево навыков ---------- */
#scr-agent{background:linear-gradient(120deg,#0b0c10 0%,#101218 45%,#08090c 100%)}
#scr-agent::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(200,255,30,.05),transparent 40%)}
.tree-wrap{flex:1;display:grid;grid-template-columns:minmax(320px,34%) 1fr;gap:0;
  min-height:0;position:relative;z-index:2}
.showcase{position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 0 0 6%;min-width:0;overflow:hidden}
.film{position:absolute;left:16%;top:-6%;bottom:-6%;width:196px;
  background:linear-gradient(180deg,#c8ff1e,#93c000);opacity:.94;
  transform:rotate(-2deg);box-shadow:0 0 60px rgba(200,255,30,.18)}
.film::before,.film::after{content:"";position:absolute;left:0;right:0;height:100%;
  background-image:repeating-linear-gradient(180deg,#0b0c10 0 15px,transparent 15px 34px);
  opacity:.92}
.film::before{width:17px;right:auto}
.film::after{left:auto;width:17px}
.film-glyph{position:absolute;left:50%;top:14%;transform:translateX(-50%);
  font-family:Impact,sans-serif;font-size:44px;color:#0e1014;opacity:.55;letter-spacing:2px;
  writing-mode:vertical-rl}
.fig{position:relative;z-index:3;height:min(78vh,660px);display:flex;justify-content:center}
.fig svg{height:100%;width:auto;filter:drop-shadow(0 22px 34px rgba(0,0,0,.75))}
.fig-shadow{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
  width:58%;height:26px;background:radial-gradient(ellipse,rgba(0,0,0,.65),transparent 70%);
  z-index:1}
.agent-tag{position:absolute;left:0;bottom:6%;z-index:4;padding-left:8px;
  border-left:4px solid var(--lime)}
.agent-tag .an{font-family:Impact,sans-serif;font-size:44px;line-height:.9;letter-spacing:1px}
.agent-tag .ar{font-size:11px;letter-spacing:3px;color:var(--lime);text-transform:uppercase;margin-top:4px}
.agent-tag .al{margin-top:8px;display:flex;gap:7px;align-items:center;font-size:11px;color:var(--dim)}
.lvbadge{background:var(--lime);color:#0a0a0d;font-family:Impact,sans-serif;padding:1px 8px;
  font-size:15px;letter-spacing:1px}

.panel-r{display:flex;flex-direction:column;padding:6px 3% 0 2%;min-height:0;overflow:hidden}
.panel-title{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.panel-title h2{font-family:Impact,sans-serif;font-size:19px;letter-spacing:2px;margin:0;
  color:#e8edf6;text-transform:uppercase}
.panel-title .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.panel-title .sp{font-family:Consolas,monospace;font-size:12px;color:var(--lime)}

.cols{display:flex;gap:14px;align-items:flex-start;margin-bottom:8px}
.caps{display:flex;gap:10px}
.cap{width:74px;background:linear-gradient(180deg,#1a1d25,#11131a);border:1px solid #262b38;
  border-radius:999px;padding:9px 0;display:flex;flex-direction:column;gap:9px;align-items:center;
  position:relative}
.cap::before{content:"";position:absolute;inset:3px;border-radius:999px;
  border:1px solid rgba(255,255,255,.03);pointer-events:none}
.node{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,#2a2f3c,#14171e);
  border:2px solid #3a4152;color:#98a0b2;font-family:Impact,sans-serif;font-size:17px;
  letter-spacing:1px;cursor:pointer;position:relative;transition:.14s}
.node:hover{border-color:#6a7488;color:#dfe5f0}
.node.avail{border-color:var(--lime);color:var(--lime);
  box-shadow:0 0 0 3px rgba(200,255,30,.13),0 0 18px rgba(200,255,30,.28);
  background:radial-gradient(circle at 50% 35%,#39461a,#14171e)}
.node.owned{background:radial-gradient(circle at 50% 40%,#d8ff4a,#9fd400);
  border-color:#e7ff8a;color:#10130a;box-shadow:0 0 18px rgba(200,255,30,.45)}
.node.locked{opacity:.42;cursor:not-allowed}
.node .lv{position:absolute;bottom:-5px;right:-3px;background:#0b0c10;border:1px solid #454d60;
  border-radius:99px;font-family:Consolas,monospace;font-size:9px;padding:0 4px;color:var(--lime)}
.node.core{width:52px;height:52px;border-radius:8px;
  clip-path:polygon(22% 0,78% 0,100% 22%,100% 78%,78% 100%,22% 100%,0 78%,0 22%)}
.node.core .cog{font-size:19px}
.gears{display:flex;flex-direction:column;gap:10px;
  padding-left:14px;border-left:1px dashed #2b3140}
.gears .gl{font-size:9px;letter-spacing:1.6px;color:var(--dim2);text-transform:uppercase;
  writing-mode:vertical-rl;height:100%}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:2px}
.tile{background:linear-gradient(155deg,#1b1e26,#101218);border:1px solid #272c39;
  padding:9px 9px 7px;cursor:pointer;position:relative;transition:.15s;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
.tile:hover{border-color:#4b556c;transform:translateY(-1px)}
.tile .t-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:#0a0b0f;border:1px solid #2f3646;font-size:15px;margin-bottom:6px}
.tile .t-lv{position:absolute;right:8px;top:8px;font-family:Impact,sans-serif;font-size:20px;
  color:#39404f}
.tile .t-n{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#c3cad8}
.tile .t-l{font-size:9px;letter-spacing:1.5px;color:var(--dim2);margin-top:2px}
.tile.can{border-color:rgba(200,255,30,.45)}
.tile.can .t-lv{color:var(--lime)}
.tile.maxed .t-lv{color:#5ee08a}

.statrow{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:auto;
  padding-top:8px;font-size:11.5px;color:#aeb7c7}
.statrow .s{display:flex;justify-content:space-between;border-bottom:1px dotted #262b38;
  padding:3px 0}
.statrow .s b{font-family:Consolas,monospace;color:#e9eef8;font-weight:500}
.statrow .s b.up{color:var(--lime)}

.tabs{display:flex;gap:6px;justify-content:flex-end;padding:10px 3% 14px}
.tab{background:#0d0e13;border:1px solid #262b38;color:#9aa3b5;font-size:12px;
  letter-spacing:1.4px;text-transform:uppercase;padding:8px 20px;cursor:pointer;
  border-radius:99px;transition:.14s;position:relative}
.tab:hover{color:#e6ecf7;border-color:#3e4658}
.tab.on{background:var(--yellow);color:#0a0a0d;border-color:var(--yellow);font-weight:700}
.tab .nd{position:absolute;top:-2px;right:-2px;width:9px;height:9px;background:var(--red);
  clip-path:polygon(50% 0,100% 100%,0 100%)}

/* инфо-панель узла */
.nodeinfo{position:absolute;right:3%;top:64px;width:290px;background:rgba(12,13,18,.96);
  border:1px solid #2c3242;border-top:3px solid var(--lime);padding:13px 15px;z-index:8;
  box-shadow:0 18px 50px #000b;animation:niIn .16s ease}
@keyframes niIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.nodeinfo .ni-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.nodeinfo .ni-t{font-family:Impact,sans-serif;font-size:17px;letter-spacing:1px}
.nodeinfo .ni-l{font-family:Consolas,monospace;font-size:11px;color:var(--lime)}
.nodeinfo .ni-d{font-size:12px;line-height:1.55;color:#c2cbd9;margin-bottom:9px}
.btn{background:var(--lime);color:#0a0a0d;border:0;font-family:Impact,sans-serif;
  font-size:14px;letter-spacing:1.6px;text-transform:uppercase;padding:9px 18px;cursor:pointer;
  clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%);transition:.14s;width:100%}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{background:#2b3140;color:#666e80;cursor:not-allowed;clip-path:none}
.btn.ghost{background:transparent;border:1px solid #39404f;color:#c3cbd8;clip-path:none}
.btn.ghost:hover{border-color:var(--lime);color:var(--lime)}
.btn.red{background:var(--red);color:#fff}
.btn.yel{background:var(--yellow);color:#0a0a0d}
.btn .cost{font-family:Consolas,monospace;font-size:12px;letter-spacing:0}

/* ---------- ГАЧА ---------- */
.banner{position:relative;flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
.banner-art{position:relative;overflow:hidden;
  background:radial-gradient(circle at 35% 45%,#2a2f18,#0b0c10 62%)}
.banner-art .rays{position:absolute;inset:-30%;
  background:repeating-conic-gradient(from 0deg,rgba(200,255,30,.09) 0deg 5deg,transparent 5deg 11deg);
  animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner-fig{position:absolute;bottom:-2%;left:8%;height:96%;z-index:2}
.banner-fig svg{height:100%}
.banner-name{position:absolute;left:4%;top:8%;z-index:3}
.banner-name .bn1{font-size:12px;letter-spacing:4px;color:var(--lime);text-transform:uppercase}
.banner-name .bn2{font-family:Impact,sans-serif;font-size:64px;line-height:.86;margin-top:6px;
  text-shadow:4px 4px 0 #000}
.banner-name .bn3{font-size:13px;color:#c6cedb;margin-top:10px;max-width:420px;line-height:1.5}
.banner-side{padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(180deg,rgba(16,17,23,.94),rgba(10,11,15,.98));
  border-left:1px solid #232833}
.rate{display:flex;justify-content:space-between;font-size:11.5px;color:#a9b2c2;
  border-bottom:1px dotted #262b38;padding:4px 0}
.rate b{color:#e8eef7;font-family:Consolas,monospace}
.rate.s5 b{color:var(--yellow)}
.pullrow{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.costln{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.pitybox{background:#0c0d12;border:1px solid #262b38;padding:8px 11px;font-size:11px;
  color:#a7b0c0;display:flex;justify-content:space-between}
.pitybox b{color:var(--yellow);font-family:Consolas,monospace}

/* результаты крутки */
.pullgrid{flex:1;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;
  padding:10px 40px 30px;align-content:center}
.card{width:126px;height:186px;position:relative;cursor:pointer;
  background:linear-gradient(170deg,#1b1e26,#0c0d12);border:1px solid #2c3242;
  animation:cardIn .34s cubic-bezier(.2,.9,.3,1.4) backwards;overflow:hidden;
  clip-path:polygon(0 0,100% 0,100% 90%,92% 100%,0 100%)}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.9) rotate(-4deg)}to{opacity:1;transform:none}}
.card .cf{position:absolute;inset:0;display:grid;place-items:end center}
.card .cf svg{height:100%}
.card .cb{position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,7,10,.96) 12%,transparent 55%)}
.card .cn{position:absolute;bottom:6px;left:8px;right:8px;font-family:Impact,sans-serif;
  font-size:15px;letter-spacing:.5px;z-index:3}
.card .ce{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;font-size:10px;font-weight:700;z-index:3}
.card .sr{position:absolute;top:6px;right:7px;font-family:Impact,sans-serif;font-size:13px;
  z-index:3}
.card.r5{border-color:var(--yellow);box-shadow:0 0 26px rgba(255,230,0,.35),inset 0 0 40px rgba(255,230,0,.09)}
.card.r5 .sr{color:var(--yellow);text-shadow:0 0 10px #ffb700}
.card.r5::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 47%,transparent 58%);
  animation:shine 2.6s infinite}
@keyframes shine{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
.card.r4{border-color:#a86bff;box-shadow:0 0 16px rgba(168,107,255,.3)}
.card.r4 .sr{color:#c9a6ff}
.card.r3{border-color:#4b586e}
.card.r3 .sr{color:#8b97ad}
.card.dupe .dup{position:absolute;bottom:26px;left:8px;font-size:9px;letter-spacing:1px;
  color:var(--cyan);z-index:3}

/* ---------- коллекция / команда ---------- */
.roster{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:12px;padding:6px 24px 24px;overflow:auto;align-content:start}
.rc{background:linear-gradient(170deg,#191c24,#0d0e13);border:1px solid #262b38;
  padding:8px;cursor:pointer;position:relative;transition:.15s;height:214px;
  clip-path:polygon(0 0,100% 0,100% 92%,93% 100%,0 100%)}
.rc:hover{border-color:var(--lime);transform:translateY(-2px)}
.rc.inparty{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime) inset}
.rc .rf{height:132px;display:grid;place-items:end center;overflow:hidden;margin:-8px -8px 4px}
.rc .rf svg{height:100%}
.rc .rn{font-family:Impact,sans-serif;font-size:15px;letter-spacing:.6px}
.rc .rr{font-size:9.5px;letter-spacing:1.4px;color:var(--dim);text-transform:uppercase;margin-top:1px}
.rc .rl{position:absolute;top:6px;right:6px;font-family:Impact,sans-serif;font-size:12px;
  background:#0a0b0fcc;padding:1px 6px;border:1px solid #333a4a}
.rc .re{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;font-size:10px;background:#0a0b0fdd}
.rc .pk{position:absolute;bottom:6px;right:6px;font-size:9px;color:var(--lime);letter-spacing:1px}
.lockedc{filter:grayscale(1) brightness(.5)}

/* ---------- магазин ---------- */
.shop{flex:1;padding:6px 24px 24px;overflow:auto;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;align-content:start}
.si{display:flex;gap:12px;align-items:center;background:linear-gradient(100deg,#181b23,#0e0f14);
  border:1px solid #262b38;padding:11px 14px}
.si .si-ic{width:40px;height:40px;display:grid;place-items:center;font-size:19px;
  background:#0a0b0f;border:1px solid #2c3242}
.si .si-m{flex:1;min-width:0}
.si .si-n{font-size:12.5px;letter-spacing:.4px}
.si .si-d{font-size:10.5px;color:var(--dim);margin-top:2px}
.si .btn{width:auto;padding:7px 14px;font-size:12px}

/* ---------- диалог ---------- */
.dlg{position:absolute;left:0;right:0;bottom:0;min-height:170px;
  background:linear-gradient(0deg,rgba(6,7,10,.98),rgba(10,11,16,.9));border-top:2px solid var(--lime);
  padding:18px 40px 22px;display:flex;gap:18px;z-index:6;cursor:pointer}
.dlg .dp{width:74px;height:74px;border:2px solid var(--lime);border-radius:50%;overflow:hidden;
  background:#0a0b0f;flex:0 0 74px}
.dlg .dp svg{width:100%;height:100%}
.dlg .dn{font-family:Impact,sans-serif;font-size:20px;letter-spacing:1px;color:var(--lime)}
.dlg .dt{font-size:14px;line-height:1.6;color:#e3e9f3;margin-top:5px;max-width:820px}
.dlg .dc{position:absolute;right:22px;bottom:14px;font-size:10px;color:var(--dim2);letter-spacing:1px}

/* ---------- прочее ---------- */
.center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:20px 40px;text-align:center;z-index:2}
.big-title{font-family:Impact,sans-serif;font-size:76px;line-height:.85;letter-spacing:2px;
  text-transform:uppercase}
.sub{font-size:13px;letter-spacing:3px;color:var(--lime);text-transform:uppercase}
.muted{color:var(--dim);font-size:12px}
.menu-btns{display:flex;flex-direction:column;gap:10px;width:320px;margin-top:8px}
.hintline{font-size:10.5px;color:var(--dim2);letter-spacing:.6px;line-height:1.7;
  max-width:760px;margin-top:6px}
.kbd{display:inline-block;background:#1b1f28;border:1px solid #333a4a;border-bottom-width:2px;
  border-radius:3px;padding:0 5px;font-family:Consolas,monospace;font-size:10.5px;color:#cfd7e5;
  margin:0 1px}

/* загрузка */
#boot{position:fixed;inset:0;z-index:9999;background:#08090c;display:grid;place-items:center;
  transition:opacity .4s}
#boot .bl{font-family:Impact,sans-serif;font-size:46px;letter-spacing:4px;color:var(--lime);
  text-align:center}
#boot .bs{width:280px;height:3px;background:#1b1f28;margin-top:16px;overflow:hidden}
#boot .bs>i{display:block;height:100%;width:0;background:var(--lime);transition:width .3s}
#boot .bt{font-size:10px;letter-spacing:3px;color:var(--dim2);margin-top:10px}

/* скролл */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#0c0d12}
::-webkit-scrollbar-thumb{background:#2c3242;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#3d4658}

/* адаптив */
@media (max-width:1080px){
  .banner{grid-template-columns:1fr 300px}
  .banner-name .bn2{font-size:44px}
  .tree-wrap{grid-template-columns:1fr}
  .showcase{display:none}
  .big-title{font-size:48px}
}

/* ------------------------------------------------------------------ УТИЛИТЫ */
const U = {
  clamp:(v,a,b)=>v<a?a:v>b?b:v,
  lerp:(a,b,t)=>a+(b-a)*t,
  rand:(a=1,b=0)=>b+Math.random()*(a-b),
  randi:(a,b)=>Math.floor(b===undefined?Math.random()*a:a+Math.random()*(b-a)),
  choice:(arr)=>arr[Math.floor(Math.random()*arr.length)],
  dist:(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1),
  dist2:(x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1;return dx*dx+dy*dy},
  ang:(x1,y1,x2,y2)=>Math.atan2(y2-y1,x2-x1),
  angDiff:(a,b)=>{let d=(b-a+Math.PI)%(Math.PI*2);if(d<0)d+=Math.PI*2;return d-Math.PI},
  fmt:(n)=>String(Math.floor(n)).padStart(1,'0'),
  comma:(n)=>Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '),
  pad:(n,l=4)=>String(Math.floor(n)).padStart(l,'0'),
  hex2rgb:(h)=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
    return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]},
  rgba:(h,a)=>{const[r,g,b]=U.hex2rgb(h);return `rgba(${r},${g},${b},${a})`},
  mix:(h1,h2,t)=>{const a=U.hex2rgb(h1),b=U.hex2rgb(h2);
    return '#'+a.map((v,i)=>Math.round(U.lerp(v,b[i],t)).toString(16).padStart(2,'0')).join('')},
  shade:(h,amt)=>{const[r,g,b]=U.hex2rgb(h);
    const f=(v)=>U.clamp(Math.round(amt>0?v+(255-v)*amt:v*(1+amt)),0,255);
    return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('')},
};

    if(this.down('KeyS','ArrowDown')) y+=1;
    if(x&&y){x*=0.7071;y*=0.7071}
    return {x,y};
  },
  endFrame(){this.pressed={};this.wheel=0},
};

/* --------------------------------------------------------------- КАНВАС --- */
const ENG = {
  cv:null, ctx:null, W:0, H:0, dpr:1,
  t:0, dt:0, last:0, timeScale:1,
  init(){
    this.cv=document.getElementById('cv');
    this.ctx=this.cv.getContext('2d');
    this.resize();
    addEventListener('resize',()=>this.resize());
  },
  resize(){
    this.dpr=Math.min(devicePixelRatio||1,2);
    this.W=innerWidth; this.H=innerHeight;
    this.cv.width=Math.floor(this.W*this.dpr);
    this.cv.height=Math.floor(this.H*this.dpr);
    this.cv.style.width=this.W+'px';
    this.cv.style.height=this.H+'px';
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
  },
};

/* --------------------------------------------------------------- КАМЕРА --- */
const CAM = {
  x:0,y:0, tx:0,ty:0, zoom:1, shakeT:0, shakeMag:0, ox:0, oy:0,
  follow(x,y,dt,snap){
    this.tx=x; this.ty=y;
    const k=snap?1:Math.min(1,dt*7.5);
    this.x=U.lerp(this.x,this.tx,k);
    this.y=U.lerp(this.y,this.ty,k);
  },
  shake(mag,dur){this.shakeMag=Math.max(this.shakeMag,mag);this.shakeT=Math.max(this.shakeT,dur)},
  update(dt){
    if(this.shakeT>0){
      this.shakeT-=dt;
      const f=Math.max(0,this.shakeT);
      const m=this.shakeMag*Math.min(1,f*5);
      this.ox=U.rand(m,-m); this.oy=U.rand(m,-m);
      if(this.shakeT<=0){this.shakeMag=0;this.ox=this.oy=0}
    }
  },
  apply(ctx){
    ctx.translate(eng_w()/2,eng_h()/2);
    ctx.scale(this.zoom,this.zoom);
    ctx.translate(-this.x+this.ox,-this.y+this.oy);
  },
  screenToWorld(sx,sy){
    return { x:(sx-eng_w()/2)/this.zoom+this.x, y:(sy-eng_h()/2)/this.zoom+this.y };
  },
  visible(x,y,r){
    const hw=eng_w()/2/this.zoom+r, hh=eng_h()/2/this.zoom+r;
    return Math.abs(x-this.x)<hw && Math.abs(y-this.y)<hh;
  },
};
const eng_w=()=>ENG.W, eng_h=()=>ENG.H;

/* ------------------------------------------------------------- ЧАСТИЦЫ ---- */
const FX = {
  list:[], texts:[], rings:[], slashes:[],
  clear(){this.list.length=0;this.texts.length=0;this.rings.length=0;this.slashes.length=0},

  spark(x,y,col,n=6,spd=170,life=0.42,size=2.6){
    for(let i=0;i<n;i++){
      const a=U.rand(6.283), s=U.rand(spd,spd*0.25);
      this.list.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life,max:life*U.rand(1.5,0.6),
        size:size*U.rand(1.4,0.6),col,g:340,drag:0.93,type:'spark'});
    }
  },
  burst(x,y,col,n=16,spd=260){
    for(let i=0;i<n;i++){
      const a=U.rand(6.283), s=U.rand(spd,spd*0.3);
      this.list.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:U.rand(0.6,0.3),max:0.6,
        size:U.rand(5,2),col,g:120,drag:0.9,type:'glow'});
    }
  },
  ring(x,y,col,r0,r1,dur=0.4,w=3){
    this.rings.push({x,y,col,r0,r1,t:0,dur,w});
  },
  slash(x,y,ang,arc,r,col,dur=0.22,w=9){
    this.slashes.push({x,y,ang,arc,r,col,t:0,dur,w});
  },
  text(x,y,txt,col,size=18,vy=-52,crit=false){
    this.texts.push({x,y,txt,col,size,vy:vy,t:0,dur:0.85,crit});
  },
  update(dt){
    for(let i=this.list.length-1;i>=0;i--){
      const p=this.list[i];
      p.life-=dt;
      if(p.life<=0){this.list.splice(i,1);continue}
      p.vy+=(p.g||0)*dt;
      p.vx*=Math.pow(p.drag||0.94,dt*60);
      p.vy*=Math.pow(p.drag||0.94,dt*60);
      p.x+=p.vx*dt; p.y+=p.vy*dt;
    }
    for(let i=this.texts.length-1;i>=0;i--){
      const t=this.texts[i]; t.t+=dt;
      if(t.t>t.dur){this.texts.splice(i,1);continue}
      t.y+=t.vy*dt; t.vy*=0.94;
    }
    for(let i=this.rings.length-1;i>=0;i--){const r=this.rings[i];r.t+=dt;if(r.t>r.dur)this.rings.splice(i,1)}
    for(let i=this.slashes.length-1;i>=0;i--){const s=this.slashes[i];s.t+=dt;if(s.t>s.dur)this.slashes.splice(i,1)}
    if(this.list.length>900) this.list.splice(0,this.list.length-900);
  },
  draw(ctx){
    ctx.save();
    for(const s of this.slashes){
      const k=s.t/s.dur, a=1-k;
      ctx.globalAlpha=a*0.9;
      ctx.strokeStyle=s.col; ctx.lineWidth=s.w*(1-k*0.55); ctx.lineCap='round';
      ctx.shadowColor=s.col; ctx.shadowBlur=18;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r*(0.8+k*0.3),s.ang-s.arc/2,s.ang+s.arc/2);
      ctx.stroke();
    }
    ctx.shadowBlur=0;
    for(const r of this.rings){
      const k=r.t/r.dur, a=1-k;
      ctx.globalAlpha=a*0.85;
      ctx.strokeStyle=r.col; ctx.lineWidth=r.w*(1-k*0.7);
      ctx.beginPath(); ctx.arc(r.x,r.y,U.lerp(r.r0,r.r1,k),0,6.2832); ctx.stroke();
    }
    for(const p of this.list){
      const a=U.clamp(p.life/p.max,0,1);
      ctx.globalAlpha=a;
      ctx.fillStyle=p.col;
      if(p.type==='glow'){ctx.shadowColor=p.col;ctx.shadowBlur=12}
      else ctx.shadowBlur=0;
      if(p.type==='spark'){
        ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size*1.6,p.size*0.9);
      } else {
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a,0,6.2832); ctx.fill();
      }
    }
    ctx.shadowBlur=0;
    for(const t of this.texts){
      const k=t.t/t.dur;
      const a=k<0.12?k/0.12:(k>0.7?(1-k)/0.3:1);
      const sc=t.crit?1.35:1;
      ctx.globalAlpha=U.clamp(a,0,1);
      ctx.font=`700 ${Math.round(t.size*sc)}px "Impact","Arial Narrow",sans-serif`;
      ctx.textAlign='center';
      ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.9)';
      ctx.strokeText(t.txt,t.x,t.y);
      ctx.fillStyle=t.col;
      ctx.fillText(t.txt,t.x,t.y);
    }
    ctx.restore();
    ctx.globalAlpha=1;
  },
};

/* ----------------------------------------------------------------- ЗВУК ---- */
const SFX = {
  ctx:null, master:null, musicGain:null, sfxGain:null, on:true, musicOn:true,
  _musicTimer:0, _step:0, _scale:[0,3,5,7,10], _root:110,
  init(){
    if(this.ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    this.ctx=new AC();
    this.master=this.ctx.createGain(); this.master.gain.value=0.55;
    const comp=this.ctx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.ratio.value=6;
    this.master.connect(comp); comp.connect(this.ctx.destination);
    this.sfxGain=this.ctx.createGain(); this.sfxGain.gain.value=0.8; this.sfxGain.connect(this.master);
    this.musicGain=this.ctx.createGain(); this.musicGain.gain.value=0.3; this.musicGain.connect(this.master);
    this.noise=this._makeNoise();
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  _makeNoise(){
    const len=this.ctx.sampleRate*1.2;
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    return buf;
  },
  tone(freq,dur,type='sine',vol=0.25,slide=0,dest){
    if(!this.ctx||!this.on) return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+dur);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest||this.sfxGain);
    o.start(t); o.stop(t+dur+0.02);
  },
  noiseHit(dur=0.12,vol=0.3,freq=900,q=1.2,type='lowpass'){
    if(!this.ctx||!this.on) return;
    const t=this.ctx.currentTime;
    const s=this.ctx.createBufferSource(); s.buffer=this.noise;
    const f=this.ctx.createBiquadFilter(); f.type=type;
    f.frequency.setValueAtTime(freq,t); f.frequency.exponentialRampToValueAtTime(Math.max(120,freq*0.3),t+dur);
    f.Q.value=q;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(this.sfxGain);
    s.start(t); s.stop(t+dur+0.02);
  },
  hit(){ this.noiseHit(0.09,0.26,1800,1.4); this.tone(150,0.09,'square',0.1,0.6) },
  heavy(){ this.noiseHit(0.22,0.36,900,1); this.tone(80,0.2,'sawtooth',0.16,0.5) },
  crit(){ this.noiseHit(0.14,0.32,2600,2); this.tone(880,0.12,'square',0.1,0.5); this.tone(1320,0.1,'sine',0.07,0.6) },
  reaction(){ this.tone(320,0.28,'triangle',0.16,2.2); this.noiseHit(0.3,0.3,1400,0.8); },
  dodge(){ this.tone(520,0.16,'sine',0.12,1.9); this.noiseHit(0.14,0.14,3200,2,'highpass') },
  swap(){ this.tone(660,0.1,'triangle',0.1,1.4); this.tone(990,0.16,'sine',0.07,1.2) },
  ult(){ this.tone(70,0.9,'sawtooth',0.22,2.6); this.noiseHit(0.7,0.4,700,0.6); },
  ui(){ this.tone(760,0.05,'square',0.05,1.1) },
  uiBig(){ this.tone(420,0.12,'triangle',0.1,1.6) },
  pickup(){ this.tone(880,0.08,'sine',0.1,1.3); setTimeout(()=>this.tone(1320,0.1,'sine',0.08,1.2),62) },
  levelup(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,0.22,'triangle',0.12),i*78)) },
  gacha(rarity){
    if(rarity>=5){[784,988,1175,1568].forEach((f,i)=>setTimeout(()=>this.tone(f,0.5,'sine',0.13),i*90))}
    else if(rarity>=4){[659,880].forEach((f,i)=>setTimeout(()=>this.tone(f,0.3,'triangle',0.1),i*100))}
    else this.tone(440,0.2,'sine',0.07);
  },
  hurt(){ this.tone(180,0.14,'sawtooth',0.14,0.6); this.noiseHit(0.14,0.2,600,1) },
  die(){ this.tone(200,0.4,'sawtooth',0.16,0.35); this.noiseHit(0.4,0.24,500,0.7) },
  /* --- простая музыкальная петля --- */
  setMood(root){
    this._root=root;
    this._step=0;
  },
  tickMusic(dt){
    if(!this.ctx||!this.musicOn||!this.on) return;
    this._musicTimer-=dt;
    const bpm=92, beat=60/bpm/2;
    if(this._musicTimer>0) return;
    this._musicTimer=beat;
    const s=this._step++;
    const root=this._root;
    // бас на каждые 4 шага
    if(s%4===0){
      this.tone(root/2,0.42,'sawtooth',0.055,1,this.musicGain);
    }
    if(s%8===3||s%8===7){
      this.tone(root*1.5,0.2,'triangle',0.035,1,this.musicGain);
    }
    // арпеджио
    if(s%2===0){
      const n=this._scale[(s*3)%this._scale.length];
      const f=root*Math.pow(2,n/12)*2;
      this.tone(f,0.26,'sine',0.028,1,this.musicGain);
    }
    if(s%16===0){
      this.tone(root*2,0.7,'sine',0.02,1,this.musicGain);
    }
  },
};

/* ------------------------------------------------------------ СОХРАНЕНИЕ -- */
const SAVE_KEY='nullsector.save.v1';
const Store = {
  save(){
    try{
      const j=JSON.stringify(G, (k,v)=> (k==='_tmp'?undefined:v));
      localStorage.setItem(SAVE_KEY,j);
      return true;
    }catch(e){console.warn('save failed',e);return false}
  },
  load(){
    try{
      const raw=localStorage.getItem(SAVE_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){return null}
  },
  wipe(){ try{localStorage.removeItem(SAVE_KEY)}catch(e){} },
  has(){ try{return !!localStorage.getItem(SAVE_KEY)}catch(e){return false} },
};

</script>
<script>
/* ==== art.js ==== */
/* ============================================================================
   НОЛЬ-СЕКТОР — ГРАФИКА: SVG-фигуры агентов + отрисовка сущностей на канвасе
   Всё процедурное: новый агент = строка данных, а не новый код.
   ========================================================================== */
const ART = (() => {

/* --------------------------------------------------------- помощники SVG -- */
const limb = (pts,w,col,cap='round') =>
  `<path d="M${pts.map(p=>p.join(' ')).join(' L')}" stroke="${col}" stroke-width="${w}"
    stroke-linecap="${cap}" stroke-linejoin="round" fill="none"/>`;

const poly = (d,fill,stroke='#0b0c10',sw=3) =>
  `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;

/* ------------------------------------------------------------- ПРИЧЁСКИ -- */
function hairBack(s,a){
  const L=a.hair, D=U.shade(a.hair,-0.22);
  switch(s){
    case 'long': return poly(`M96 96 C86 60 104 52 120 52 C136 52 154 60 144 96
      L152 230 C146 246 138 250 120 250 C102 250 94 246 88 230 Z`,L, D,3);

      stroke-linecap="round" fill="none"/>` + poly(`M96 92 C90 62 106 54 120 54

    case 'bun': return `<circle cx="120" cy="46" r="16" fill="${L}" stroke="#0b0c10" stroke-width="3"/>`

    case 'messy': return poly(`M94 100 C84 66 102 50 120 50 C140 50 158 66 146 100
      L154 128 L138 118 L146 148 L126 132 L118 152 L108 134 L96 146 L100 120 L88 128 Z`,L,'#0b0c10',3);
    default: return poly(`M96 94 C92 62 106 54 120 54 C136 54 150 62 146 96 L146 112 L94 112 Z`,L,'#0b0c10',3);
  }
}
function hairFront(s,a){
  const L=a.hair, H=a.hair2;
  switch(s){

      L146 52 L142 74 L156 66 L146 88 Z" fill="${L}" stroke="#0b0c10" stroke-width="3" stroke-linejoin="round"/>`;
    case 'long': return poly(`M94 88 C92 62 106 54 120 54 C134 54 148 62 146 88
      L138 80 L132 92 L124 78 L116 94 L108 78 L100 92 Z`,L,'#0b0c10',3)

         <path d="M148 88 C152 120 150 150 144 168" stroke="${H}" stroke-width="7" stroke-linecap="round" fill="none"/>`;

    case 'pony': return poly(`M96 88 C92 62 106 54 120 54 C134 54 148 62 144 88
      L136 78 L128 90 L120 76 L112 90 L104 78 Z`,L,'#0b0c10',3);
    case 'messy': return poly(`M94 88 C90 58 108 50 122 50 C140 50 152 62 146 88
      L138 76 L130 92 L118 74 L110 92 L102 78 Z`,L,'#0b0c10',3)
      + `<path d="M104 58 C118 50 138 54 146 66" stroke="${H}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    case 'bun': return poly(`M96 88 C92 62 106 54 120 54 C134 54 148 62 144 88

/* -------------------------------------------------------------- ОРУЖИЕ --- */
function weapon(kind,a){

/* ------------------------------------------------------------ ФИГУРА ----- */
function figure(c,o={}){
  const a=c.art, el=DATA.EL[c.el];
  const s=a.suit, s2=a.suit2, ac=a.accent, sk=a.skin;
  const dark=U.shade(a.suit,-0.4);
  const w=o.w||'100%', h=o.h||'100%';
  const skinS=U.shade(sk,-0.14);
  const stance = o.pose||'idle';

  return `<svg viewBox="0 0 240 430" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg"
    preserveAspectRatio="xMidYMax meet">
  <defs>

  </defs>

  <ellipse cx="120" cy="300" rx="112" ry="140" fill="url(#rg-${c.id})"/>
  <ellipse cx="120" cy="404" rx="66" ry="13" fill="#000" opacity=".5"/>

  ${hairBack(a.hairStyle,a)}

  <!-- ноги -->
  ${limb([[104,268],[100,336],[98,396]],17,dark)}
  ${limb([[136,268],[140,336],[142,396]],17,dark)}
  <ellipse cx="96" cy="400" rx="15" ry="8" fill="${s2}" stroke="#0b0c10" stroke-width="3"/>

/* ----------------------------------------------------------- ПОРТРЕТ ----- */
function portrait(c){
  const a=c.art;
  return `<svg viewBox="30 30 180 180" xmlns="http://www.w3.org/2000/svg"
    preserveAspectRatio="xMidYMid slice">
    <rect x="30" y="30" width="180" height="180" fill="${U.shade(a.suit2,-0.35)}"/>
    ${hairBack(a.hairStyle,a)}
    ${poly(`M84 150 L156 150 L166 210 L74 210 Z`,a.suit)}
    ${poly(`M104 152 L136 152 L138 178 L120 196 L102 178 Z`,a.suit2,'none',0)}
    <rect x="110" y="118" width="20" height="26" rx="6" fill="${U.shade(a.skin,-0.14)}" stroke="#0b0c10" stroke-width="2"/>
    <ellipse cx="120" cy="96" rx="26" ry="29" fill="${a.skin}" stroke="#0b0c10" stroke-width="3"/>
    <path d="M96 84 Q120 96 144 84 L144 76 Q120 86 96 76 Z" fill="${U.shade(a.skin,-0.14)}" opacity=".7"/>
    ${hairFront(a.hairStyle,a)}
    <ellipse cx="110" cy="100" rx="3.4" ry="4.2" fill="#101318"/>
    <ellipse cx="131" cy="100" rx="3.4" ry="4.2" fill="#101318"/>
    <circle cx="111" cy="98.6" r="1.5" fill="${a.eye}"/>
    <circle cx="132" cy="98.6" r="1.5" fill="${a.eye}"/>
    <path d="M116 112 Q120 115 125 112" stroke="#101318" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>`;
}

/* ================================================== ОТРИСОВКА НА КАНВАСЕ == */
function shadow(ctx,x,y,rx){ 
  ctx.fillStyle='rgba(0,0,0,.42)';
  ctx.beginPath(); ctx.ellipse(x,y,rx,rx*0.36,0,0,6.2832); ctx.fill();
}

/* --- агент в бою/мире --- */
function drawAgent(ctx,e,t){
  const c=e.char, a=c.art, el=DATA.EL[c.el];
  const bob=Math.sin(t*10+e.animPhase)*(e.moving?1.8:0.8);
  const x=e.x, y=e.y;
  const flip=e.face<0?-1:1;

  shadow(ctx,x,y+2,20);

  // аура элемента
  if(e.auraGlow>0){
    ctx.globalAlpha=U.clamp(e.auraGlow,0,1)*0.5;
    const g=ctx.createRadialGradient(x,y-16,2,x,y-16,34);
    g.addColorStop(0,el.c); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y-16,34,0,6.2832); ctx.fill();
    ctx.globalAlpha=1;
  }

  ctx.save();
  ctx.translate(x,y-3+bob);
  ctx.scale(flip*1.28,1.28);

  if(e.hurtFlash>0){
    ctx.globalAlpha=0.9;
  }

  // ноги
  const legSw=e.moving?Math.sin(t*12)*4:0;
  ctx.strokeStyle=U.shade(a.suit,-0.3); ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-4,-16); ctx.lineTo(-5+legSw,-1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4,-16); ctx.lineTo(5-legSw,-1); ctx.stroke();

  // корпус
  ctx.fillStyle=a.suit;
  ctx.beginPath();
  ctx.moveTo(-8,-36); ctx.lineTo(8,-36); ctx.lineTo(10,-18); ctx.lineTo(-10,-18); ctx.closePath(); ctx.fill();
  // акцентная полоса
  ctx.fillStyle=a.accent;
  ctx.fillRect(-8,-31,16,2.4);
  // голова
  ctx.fillStyle=a.skin;
  ctx.beginPath(); ctx.arc(0,-43,8,0,6.2832); ctx.fill();
  // волосы
  ctx.fillStyle=a.hair;
  ctx.beginPath(); ctx.arc(0,-44,8.2,Math.PI*0.98,Math.PI*2.12); ctx.fill();
  ctx.fillRect(-8.2,-46,5,7);
  // глаз
  ctx.fillStyle=a.eye;
  ctx.fillRect(2.5,-44.5,2.6,2.2);

  // оружие
  drawWeaponSmall(ctx,c,e,t);

  // вспышка урона
  if(e.hurtFlash>0){
    ctx.globalAlpha=e.hurtFlash*0.75;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(0,-26,12,20,0,0,6.2832); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();

  // полоса ауры над головой
  if(e.aura){
    ctx.fillStyle=DATA.EL[e.aura.el].c;
    ctx.globalAlpha=0.9;
    ctx.beginPath(); ctx.arc(x,y-56,3,0,6.2832); ctx.fill();
    ctx.globalAlpha=1;
  }
}

function drawWeaponSmall(ctx,c,e,t){
  const a=c.art, ac=a.accent, sw=Math.sin(t*9)*0.2;
  ctx.save();
  ctx.translate(9,-24);
  ctx.rotate(-0.35+sw*(e.attacking?3:1));
  ctx.lineCap='round';
  switch(a.weapon){
    case 'katana':
      ctx.strokeStyle='#c9d3e2'; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(20,-14); ctx.stroke();
      ctx.strokeStyle=ac; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(20,-14); ctx.stroke();
      break;
    case 'scythe':
      ctx.strokeStyle='#9aa5b6'; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.moveTo(0,4); ctx.lineTo(4,-20); ctx.stroke();
      ctx.strokeStyle=ac; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(4,-20,10,-0.4,1.5); ctx.stroke();
      break;
    case 'hammer':
      ctx.strokeStyle='#9aa5b6'; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.moveTo(0,2); ctx.lineTo(6,-18); ctx.stroke();
      ctx.fillStyle=a.suit2; ctx.fillRect(0,-22,13,8);
      ctx.strokeStyle=ac; ctx.lineWidth=1.6; ctx.strokeRect(0,-22,13,8);
      break;
    case 'shield':
      ctx.fillStyle=a.suit2; ctx.strokeStyle=ac; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(2,-10); ctx.lineTo(14,-8); ctx.lineTo(15,4); ctx.lineTo(8,10);
      ctx.lineTo(1,3); ctx.closePath(); ctx.fill(); ctx.stroke();
      break;
    case 'daggers':
      ctx.strokeStyle='#d6dfee'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(10,-10); ctx.moveTo(0,2); ctx.lineTo(9,8); ctx.stroke();
      break;
    case 'flamer':
      ctx.fillStyle='#7d879a'; ctx.fillRect(-2,-3,18,6);
      ctx.fillStyle=ac; ctx.beginPath(); ctx.arc(17,0,2.6,0,6.2832); ctx.fill();
      break;
    case 'gauntlets':
      ctx.fillStyle=a.suit2; ctx.fillRect(-2,-4,9,9);
      ctx.strokeStyle=ac; ctx.lineWidth=1.4; ctx.strokeRect(-2,-4,9,9);
      break;
    case 'amp':
      ctx.rotate(0.4);
      ctx.fillStyle=a.suit2; ctx.fillRect(-3,-8,10,15);
      ctx.strokeStyle=ac; ctx.lineWidth=1.2; ctx.strokeRect(-3,-8,10,15);
      break;
    case 'drone':
      ctx.fillStyle=a.suit2; ctx.beginPath(); ctx.arc(6,-6,5,0,6.2832); ctx.fill();
      ctx.strokeStyle=ac; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(6,-6,6.5,0,6.2832); ctx.stroke();
      break;
  }
  ctx.restore();
}

/* --- враги --- */
function drawEnemy(ctx,e,t){
  const d=e.def, el=DATA.EL[d.el];
  const x=e.x, y=e.y;
  const s=e.r/16;
  const bob=Math.sin(t*4.5+e.seed)*1.8;
  shadow(ctx,x,y+1,e.r*1.05);

  ctx.save();
  ctx.translate(x,y-2+bob);
  ctx.scale(s*e.face, s);

  const bodyCol = e.hurtFlash>0 ? '#ffffff' : el.c;
  const darkCol = U.shade(el.c,-0.55);

  if(e.stunT>0){
    ctx.globalAlpha=0.85;
  }

  const ty=e.type;
  if(ty==='scrap'||ty==='junk'){
    // коробка на ножках
    ctx.fillStyle=darkCol;
    ctx.fillRect(-4,-14,3.5,13); ctx.fillRect(3,-14,3.5,13);
    ctx.fillStyle=bodyCol;
    ctx.beginPath(); ctx.moveTo(-13,-30); ctx.lineTo(13,-30); ctx.lineTo(15,-14); ctx.lineTo(-15,-14);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#0b0c10'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#0b0c10'; ctx.fillRect(-8,-26,16,5);
    ctx.fillStyle=e.hurtFlash>0?'#fff':'#fff';
    ctx.fillRect(-6,-25,4,3); ctx.fillRect(2,-25,4,3);
    if(ty==='junk'){ ctx.strokeStyle=el.c; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,-34,5,0,6.2832); ctx.stroke(); }
  } else if(ty==='spark'||ty==='wisp'||ty==='screech'){
    // парящая сфера
    const r=ty==='screech'?20:12;
    ctx.shadowColor=el.c; ctx.shadowBlur=16;
    ctx.fillStyle=bodyCol;
    ctx.beginPath(); ctx.arc(0,-22,r,0,6.2832); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='#0b0c10'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#0b0c10';
    ctx.beginPath(); ctx.arc(-r*0.35,-24,r*0.18,0,6.2832); ctx.arc(r*0.35,-24,r*0.18,0,6.2832); ctx.fill();
    ctx.strokeStyle=el.c; ctx.lineWidth=1.6;
    for(let i=0;i<3;i++){
      const a=t*1.6+i*2.09;
      ctx.beginPath(); ctx.arc(0,-22,r+5+Math.sin(t*3+i)*2,a,a+0.7); ctx.stroke();
    }
  } else if(ty==='frost'){
    // кристалл
    ctx.fillStyle=bodyCol;
    ctx.beginPath(); ctx.moveTo(0,-38); ctx.lineTo(11,-22); ctx.lineTo(6,-8);
    ctx.lineTo(-6,-8); ctx.lineTo(-11,-22); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#0b0c10'; ctx.lineWidth=2; ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.globalAlpha=.7; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,-34); ctx.lineTo(0,-12); ctx.stroke();
    ctx.globalAlpha=1;
  } else if(ty==='ember'||ty==='stoker'){
    // огненный комок с руками
    ctx.shadowColor=el.c; ctx.shadowBlur=18;
    ctx.fillStyle=bodyCol;
    ctx.beginPath(); ctx.ellipse(0,-20,13,15,0,0,6.2832); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#ffd166'; ctx.globalAlpha=.6;
    ctx.beginPath(); ctx.ellipse(0,-18,6,8,0,0,6.2832); ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle=darkCol; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-12,-22); ctx.lineTo(-20,-14); ctx.moveTo(12,-22); ctx.lineTo(20,-14); ctx.stroke();
  } else if(ty==='butcher'||ty==='turbine'){
    // крупный механоид
    ctx.fillStyle=darkCol;
    ctx.fillRect(-7,-20,5,19); ctx.fillRect(2,-20,5,19);
    ctx.fillStyle=bodyCol;
    ctx.beginPath(); ctx.moveTo(-17,-42); ctx.lineTo(17,-42); ctx.lineTo(20,-18); ctx.lineTo(-20,-18);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#0b0c10'; ctx.lineWidth=2.4; ctx.stroke();
    ctx.fillStyle='#0b0c10'; ctx.fillRect(-11,-38,22,6);
    ctx.fillStyle='#ff4d1a'; ctx.fillRect(-8,-36.5,5,3); ctx.fillRect(3,-36.5,5,3);
    ctx.strokeStyle=el.c; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(18,-40); ctx.lineTo(26,-30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-18,-40); ctx.lineTo(-26,-30); ctx.stroke();
  } else {
    // босс / прочее
    ctx.fillStyle=darkCol;
    ctx.fillRect(-10,-24,7,23); ctx.fillRect(3,-24,7,23);
    ctx.fillStyle=bodyCol;
    ctx.beginPath(); ctx.ellipse(0,-34,22,20,0,0,6.2832); ctx.fill();
    ctx.strokeStyle='#0b0c10'; ctx.lineWidth=3; ctx.stroke();
  }

  if(e.hurtFlash>0){
    ctx.globalAlpha=e.hurtFlash*0.6;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(0,-24,15,20,0,0,6.2832); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();

  // заморозка
  if(e.frozen>0){
    ctx.globalAlpha=0.55;
    ctx.fillStyle='#8ce9ff';
    ctx.beginPath(); ctx.moveTo(x-14,y-46); ctx.lineTo(x+14,y-46); ctx.lineTo(x+12,y-2);
    ctx.lineTo(x-12,y-2); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1;
  }
  // оглушение
  if(e.stunT>0){
    ctx.fillStyle='#ffe600';
    for(let i=0;i<3;i++){
      const a=t*3+i*2.09;
      ctx.beginPath(); ctx.arc(x+Math.cos(a)*11, y-50+Math.sin(a)*4, 2.4,0,6.2832); ctx.fill();
    }
  }
  // аура
  if(e.aura){
    ctx.fillStyle=DATA.EL[e.aura.el].c;
    ctx.globalAlpha=0.85;
    ctx.beginPath(); ctx.arc(x+e.r*0.9, y-52, 4, 0, 6.2832); ctx.fill();
    ctx.globalAlpha=1;
  }
}

/* --- пиктограмма элемента --- */
function elIcon(elId,size=16){
  const el=DATA.EL[elId];
  return `<span style="display:inline-grid;place-items:center;width:${size}px;height:${size}px;
    border-radius:50%;background:${U.rgba(el.c,.18)};color:${el.c};font-size:${size*0.7}px;
    border:1px solid ${U.rgba(el.c,.5)}">${el.g}</span>`;
}

return { figure, portrait, drawAgent, drawEnemy, elIcon, shadow };
})();
</script>
<script>
/* ==== world.js ==== */
/* ============================================================================
   НОЛЬ-СЕКТОР — МИР: карта, районы, реквизит, коллизии, погода, миникарта
   ========================================================================== */
'use strict';

/* ------------------------------------------------------------ генератор --- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const T = { VOID:0, GROUND:1, ROAD:2, WALL:3, WATER:4, LAVA:5, ICE:6, METAL:7, RIFT:8, RUBBLE:9, GRASS:10 };

const MAP = {
  w:DATA.WORLD.w, h:DATA.WORLD.h, ts:DATA.WORLD.tile,
  tiles:null, props:[], objs:[], spawns:[], bossSpots:[], pads:[],
  rnd:null, seed:1337,

  build(){
    this.rnd=mulberry32(this.seed);
    const {w,h}=this;
    this.tiles=new Uint8Array(w*h).fill(T.VOID);
    this.props=[]; this.objs=[]; this.spawns=[]; this.bossSpots=[]; this.pads=[];

    /* --- заливка районов --- */
    for(const r of DATA.REGIONS){
      const [rx,ry,rw,rh]=r.rect;
      const base = r.ground==='city'?T.METAL : r.ground==='rust'?T.RUBBLE
                 : r.ground==='furnace'?T.METAL : r.ground==='cryo'?T.ICE : T.RIFT;
      for(let y=ry;y<ry+rh;y++)for(let x=rx;x<rx+rw;x++){
        if(x<0||y<0||x>=w||y>=h) continue;
        this.set(x,y,base);
      }
      // пятна второго типа
      const patchA = r.ground==='city'?T.ROAD : r.ground==='rust'?T.GROUND : null;
      if(patchA) this.blobs(r, patchA, 6, 4);
      const patchB = r.ground==='furnace'?T.LAVA : r.ground==='cryo'?T.WATER
                   : r.ground==='rift'?T.RIFT : T.RUBBLE;
      this.blobs(r, patchB, 5, 4);
      if(r.ground==='furnace') this.blobs(r,T.RUBBLE,5,3);
      if(r.ground==='cryo') this.blobs(r,T.ICE,4,3);
      if(r.ground==='rust') this.blobs(r,T.RUBBLE,5,3);
    }

    /* --- дороги между районами --- */
    const c=i=>{const r=DATA.REGIONS[i].rect;return {x:Math.floor(r[0]+r[2]/2),y:Math.floor(r[1]+r[3]/2)}};
    const order=['hub','rust','furnace','cryo','rift'];
    for(let i=0;i<order.length;i++){
      for(let j=i+1;j<order.length;j++){
        if(i!==0 && j!==0 && !(j===i+1)) continue;
        this.road(c(order.indexOf(order[i])),c(order.indexOf(order[j])));
      }
    }
    // центральная площадь
    this.plaza(48,18,7);

    /* --- город: кварталы --- */
    for(let bx=30;bx<=62;bx+=8){
      for(let by=7;by<=26;by+=7){
        if(this.rnd()<0.18) continue;
        const bw=3+Math.floor(this.rnd()*3), bh=2+Math.floor(this.rnd()*2);
        this.building(bx,by,bw,bh, this.rnd()<0.5?'#1b2028':'#20242c');
      }
    }
    // стены по периметру города (с проёмами на дорогах)
    for(let x=28;x<70;x++){ if(this.tiles[5*w+x]!==T.ROAD&&this.rnd()<0.85) this.set(x,5,T.WALL);
                            if(this.tiles[29*w+x]!==T.ROAD&&this.rnd()<0.8) this.set(x,29,T.WALL); }

    /* --- реквизит по районам --- */
    for(const r of DATA.REGIONS) this.scatterProps(r);

    /* --- объекты --- */
    this.placeObjects();

    /* --- точки спавна врагов --- */
    for(const r of DATA.REGIONS){
      if(r.safe) continue;
      const [rx,ry,rw,rh]=r.rect;
      for(let i=0;i<12;i++){
        const x=rx+2+Math.floor(this.rnd()*(rw-4));
        const y=ry+2+Math.floor(this.rnd()*(rh-4));
        if(!this.walkable(x,y)) continue;
        this.spawns.push({x:x*this.ts+this.ts/2, y:y*this.ts+this.ts/2, region:r.id,
          types:r.enemies, lvl:r.lvl});
      }
    }
    // боссы
    this.bossSpots=[
      {id:'golem', x:74*this.ts, y:50*this.ts, region:'furnace', lvl:14},
      {id:'queen', x:26*this.ts, y:72*this.ts, region:'cryo',    lvl:20},
      {id:'nullb', x:78*this.ts, y:72*this.ts, region:'rift',    lvl:28},
    ];
    // точки быстрого перемещения
    this.pads=[
      {id:'hub',   x:48*this.ts, y:19*this.ts, region:'hub', n:'КАЙРОС'},
      {id:'rust',  x:20*this.ts, y:44*this.ts, region:'rust', n:'РЖАВЫЙ ПОЯС'},
      {id:'furnace',x:64*this.ts,y:42*this.ts, region:'furnace', n:'ГОЛОДНАЯ ПЕЧЬ'},
      {id:'cryo',  x:24*this.ts, y:70*this.ts, region:'cryo', n:'КРИОБУХТА'},
      {id:'rift',  x:70*this.ts, y:70*this.ts, region:'rift', n:'РАЗЛОМ НОЛЬ'},
    ];
  },

  set(x,y,t){ if(x>=0&&y>=0&&x<this.w&&y<this.h) this.tiles[y*this.w+x]=t; },
  get(x,y){ if(x<0||y<0||x>=this.w||y>=this.h) return T.VOID; return this.tiles[y*this.w+x]; },

  blobs(region, type, count, size){
    const rnd=this.rnd, [rx,ry,rw,rh]=region.rect;
    for(let i=0;i<count;i++){
      const cx=rx+rnd()*rw, cy=ry+rnd()*rh, rad=size*(0.6+rnd()*1.2);
      for(let y=Math.floor(cy-rad);y<=cy+rad;y++)for(let x=Math.floor(cx-rad);x<=cx+rad;x++){
        const d=Math.hypot(x-cx,y-cy);
        if(d<rad*(0.7+rnd()*0.5)) this.set(x,y,type);
      }
    }
  },

  road(a,b){
    const w=this.w;
    const hz=(y,x1,x2)=>{for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)
      for(let d=-1;d<=1;d++){ const t=this.get(x,y+d); if(t===T.WALL) continue; this.set(x,y+d,T.ROAD); }};
    const vz=(x,y1,y2)=>{for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)
      for(let d=-1;d<=1;d++){ const t=this.get(x+d,y); if(t===T.WALL) continue; this.set(x+d,y,T.ROAD); }};
    hz(a.y,a.x,b.x); vz(b.x,a.y,b.y);
  },

  plaza(cx,cy,r){
    for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++){
      if(Math.hypot(x-cx,y-cy)>r) continue;
      this.set(x,y,T.ROAD);
    }
  },

  building(x,y,w,h){
    for(let i=0;i<w;i++)for(let j=0;j<h;j++){
      if(this.get(x+i,y+j)===T.ROAD) continue;
      this.set(x+i,y+j,T.WALL);
    }
    // неоновые вывески на фасаде
    this.props.push({t:'sign', x:(x+w/2)*this.ts, y:(y+h)*this.ts-6,
      w:w*this.ts*0.8, h:10, col:this.rnd()<0.5?'#c8ff1e':'#ff2e88', txt:''});
  },

  scatterProps(r){
    const rnd=this.rnd, [rx,ry,rw,rh]=r.rect;
    const n=Math.floor(rw*rh*0.16);
    for(let i=0;i<n;i++){
      const tx=rx+1+Math.floor(rnd()*(rw-2));
      const ty=ry+1+Math.floor(rnd()*(rh-2));
      if(!this.walkable(tx,ty)) continue;
      const x=tx*this.ts+this.ts/2, y=ty*this.ts+this.ts/2;
      let t;
      if(r.ground==='city')       t = U.choice(['barrel','sign2','lamp','vending','crate']);
      else if(r.ground==='rust')  t = U.choice(['wreck','barrel','pipe','crate','fence']);
      else if(r.ground==='furnace')t= U.choice(['pipe','barrel','furnace','crate','wreck']);
      else if(r.ground==='cryo')  t = U.choice(['crystal','wreck','barrel','fence','crate']);
      else                        t = U.choice(['shard','crystal','wreck','shard']);
      if(t==='barrel'&&rnd()<0.4) continue;
      this.props.push({t,x,y, r:(t==='crate'?13:t==='barrel'?10:0),
        solid:['wreck','barrel','crate','fence','pipe','furnace','vending','crystal'].includes(t),
        s:0.8+rnd()*0.5, rot:rnd()*6.283, col:U.choice(['#c8ff1e','#ff2e88','#22e0ff','#ffe14d'])});
    }
  },

  placeObjects(){
    const ts=this.ts;
    // сундуки
    const chestSpots=[[16,40],[30,36],[38,52],[22,54],[60,36],[70,50],[84,44],
                      [12,68],[34,78],[42,66],[66,72],[84,76],[72,66]];
    chestSpots.forEach(([x,y],i)=>{
      if(!this.walkable(x,y)) return;
      this.objs.push({t:'chest', id:'ch'+i, x:x*ts+ts/2, y:y*ts+ts/2, opened:false,
        reward: i%3===0?{eth:60,cr:200}:i%3===1?{cr:420,chip:2}:{eth:120,cr:120,chip:1}});
    });
    // терминал крутки + магазин в городе
    this.objs.push({t:'terminal', id:'gacha', x:45*ts, y:14*ts, label:'КАНАЛ'});
    this.objs.push({t:'shop',     id:'shop',  x:52*ts, y:14*ts, label:'МАГАЗИН'});
    this.objs.push({t:'board',    id:'board', x:41*ts, y:22*ts, label:'ЗАКАЗЫ'});
    this.objs.push({t:'save',     id:'save',  x:48*ts, y:24*ts, label:'СОХРАНИТЬ'});
    // NPC
    DATA.NPCS.forEach((n,i)=>{
      this.objs.push({t:'npc', id:n.id, x:n.x*ts, y:n.y*ts, npc:n, label:n.name});
    });
  },

  /* ------------------------------------------------------------ запросы -- */
  walkable(tx,ty){
    const t=this.get(tx,ty);
    return t===T.GROUND||t===T.ROAD||t===T.RUBBLE||t===T.METAL||t===T.ICE||t===T.GRASS;
  },
  solidTile(tx,ty){ return !this.walkable(tx,ty); },

  solidAt(x,y,r=12){
    const ts=this.ts;
    // тайлы
    for(let ty=Math.floor((y-r)/ts);ty<=Math.floor((y+r)/ts);ty++)
      for(let tx=Math.floor((x-r)/ts);tx<=Math.floor((x+r)/ts);tx++)
        if(this.solidTile(tx,ty)) return true;
    // пропсы
    for(const p of this.props){
      if(!p.solid) continue;
      const dx=x-p.x, dy=y-(p.y-8);
      if(Math.abs(dx)<(p.r||16)+r*0.6 && Math.abs(dy)<(p.r||16)+r*0.4) return true;
    }
    return false;
  },

  regionAt(x,y){
    const tx=x/this.ts, ty=y/this.ts;
    for(const r of DATA.REGIONS){
      const[ax,ay,aw,ah]=r.rect;
      if(tx>=ax&&tx<ax+aw&&ty>=ay&&ty<ay+ah) return r;
    }
    return DATA.REGIONS[0];
  },

  /* ------------------------------------------------------------ рисование */
  terrainCol(t,region){
    const g=region.ground;
    switch(t){
      case T.ROAD:  return g==='city'?'#4a5468':g==='rust'?'#4e412a':g==='furnace'?'#453022':
                           g==='cryo'?'#3a5c70':'#332347';
      case T.WALL:  return g==='city'?'#12161e':'#171315';
      case T.WATER: return '#123246';
      case T.LAVA:  return '#c43c00';
      case T.ICE:   return '#284e60';
      case T.METAL: return g==='city'?'#2d3644':g==='furnace'?'#332520':'#272123';
      case T.RIFT:  return '#221636';
      case T.RUBBLE:return g==='rust'?'#3d3324':'#2b241e';
      case T.GRASS: return '#1f2a1c';
      default:      return '#0d0e13';
    }
  },

  drawTerrain(ctx,cam,t){
    const ts=this.ts;
    const x0=Math.max(0,Math.floor((cam.x-cam.w/2)/ts)-1);
    const x1=Math.min(this.w-1,Math.ceil((cam.x+cam.w/2)/ts)+1);
    const y0=Math.max(0,Math.floor((cam.y-cam.h/2)/ts)-1);
    const y1=Math.min(this.h-1,Math.ceil((cam.y+cam.h/2)/ts)+1);

    for(let y=y0;y<=y1;y++){
      for(let x=x0;x<=x1;x++){
        const t2=this.get(x,y);
        const px=x*ts, py=y*ts;
        const reg=this.regionAt(px+ts/2,py+ts/2);
        const g=reg.ground;
        let col=this.terrainCol(t2,reg);
        const hash=(((x*374761393)^(y*668265263))>>>0);

        /* ---- пол ---- */
        if(t2===T.ROAD){
          ctx.fillStyle=col; ctx.fillRect(px,py,ts+1,ts+1);
          // разметка
          if(hash%7===0){
            ctx.fillStyle='rgba(255,225,77,.16)';
            ctx.fillRect(px+ts*0.15,py+ts*0.45,ts*0.7,3);
          }
          if(hash%13===0){
            ctx.fillStyle='rgba(0,0,0,.25)';
            ctx.fillRect(px+ts*0.3,py+ts*0.2,ts*0.4,ts*0.12);
          }
          // бордюр на стыке с не-дорогой
          const up=this.get(x,y-1), dn=this.get(x,y+1);
          if(up!==T.ROAD&&up!==T.WALL){ ctx.fillStyle='rgba(255,255,255,.14)'; ctx.fillRect(px,py,ts+1,2); }
          if(dn!==T.ROAD&&dn!==T.WALL){ ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(px,py+ts-2,ts+1,2); }
        }
        else if(t2===T.WALL){
          const below=this.get(x,y+1), above=this.get(x,y-1);
          const l=this.get(x-1,y), r=this.get(x+1,y);
          // корпус
          ctx.fillStyle='#0b0e14'; ctx.fillRect(px,py,ts+1,ts+1);
          // крыша
          ctx.fillStyle='#1c222c'; ctx.fillRect(px,py,ts+1,ts*0.52);
          ctx.fillStyle='rgba(255,255,255,.035)'; ctx.fillRect(px,py,ts+1,3);
          // фасад
          if(below!==T.WALL){
            ctx.fillStyle='#10131a'; ctx.fillRect(px,py+ts*0.5,ts+1,ts*0.5);
            if(hash%3===0){
              ctx.fillStyle=hash%2?'#ffe14d':'#7fe4ff';
              ctx.globalAlpha=.42;
              ctx.fillRect(px+ts*0.18,py+ts*0.58,ts*0.2,ts*0.2);
              ctx.fillRect(px+ts*0.58,py+ts*0.58,ts*0.2,ts*0.2);
              ctx.globalAlpha=1;
            }
          }
          // кромки
          if(above!==T.WALL){
            ctx.fillStyle='rgba(200,255,30,.30)'; ctx.fillRect(px,py,ts+1,3);
            ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(px,py-10,ts+1,10);
          }
          if(l!==T.WALL){ ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(px-8,py,9,ts+1); }
          if(r!==T.WALL){ ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(px+ts,py,4,ts+1); }
          if(below!==T.WALL){ ctx.fillStyle='rgba(0,0,0,.65)'; ctx.fillRect(px,py+ts,ts+1,10); }
          continue;
        }
        else {
          ctx.fillStyle=col; ctx.fillRect(px,py,ts+1,ts+1);
          // затемнение у стен (псевдо-объём)
          const nW=(this.get(x,y-1)===T.WALL?1:0)+(this.get(x-1,y)===T.WALL?1:0)
                  +(this.get(x+1,y)===T.WALL?1:0)+(this.get(x,y+1)===T.WALL?1:0);
          if(nW){
            ctx.fillStyle=`rgba(0,0,0,${0.10+nW*0.06})`;
            ctx.fillRect(px,py,ts+1,ts+1);
            if(this.get(x,y-1)===T.WALL){ ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(px,py,ts+1,10); }
            if(this.get(x,y+1)===T.WALL){ ctx.fillStyle='rgba(0,0,0,.30)'; ctx.fillRect(px,py+ts-8,ts+1,8); }
            if(this.get(x-1,y)===T.WALL){ ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(px,py,8,ts+1); }
            if(this.get(x+1,y)===T.WALL){ ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fillRect(px+ts-8,py,8,ts+1); }
          }
          // фактура пола
          if(t2===T.METAL){
            if(hash%4===0){
              ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1;
              ctx.strokeRect(px+0.5,py+0.5,ts,ts);
            }
            if(hash%17===0){
              ctx.fillStyle='rgba(200,255,30,.07)';
              ctx.fillRect(px+ts*0.2,py+ts*0.2,ts*0.6,ts*0.06);
            }
          }
          if(t2===T.RUBBLE){
            if(hash%5===0){
              ctx.fillStyle='rgba(0,0,0,.22)';
              ctx.fillRect(px+ts*0.25,py+ts*0.3,ts*0.3,ts*0.16);
            }
            if(hash%9===0){
              ctx.fillStyle='rgba(255,150,60,.12)';
              ctx.fillRect(px+ts*0.6,py+ts*0.65,ts*0.18,ts*0.1);
            }
          }
          if(t2===T.ICE){
            if(hash%6===0){
              ctx.strokeStyle='rgba(180,240,255,.14)'; ctx.lineWidth=1;
              ctx.beginPath();
              ctx.moveTo(px+ts*0.2,py+ts*0.3); ctx.lineTo(px+ts*0.5,py+ts*0.45);
              ctx.lineTo(px+ts*0.4,py+ts*0.8); ctx.stroke();
            }
          }
          if(t2===T.RIFT){
            const w=Math.sin(t*1.2+x*0.4+y*0.3)*0.5+0.5;
            ctx.fillStyle=`rgba(168,107,255,${0.05+w*0.09})`;
            ctx.fillRect(px,py,ts,ts);
            if(hash%8===0){
              ctx.fillStyle='rgba(255,225,77,.10)';
              ctx.fillRect(px+ts*0.4,py+ts*0.4,ts*0.2,ts*0.2);
            }
          }
        }

        /* ---- вода / лава ---- */
        if(t2===T.WATER){
          const w=Math.sin(t*1.4+x*0.4+y*0.25)*0.5+0.5;
          ctx.fillStyle=U.mix('#0e2b3c','#245a72',w*0.7);
          ctx.fillRect(px,py,ts+1,ts+1);
        }
        if(t2===T.LAVA){
          const w=Math.sin(t*2.2+x*0.6-y*0.4)*0.5+0.5;
          ctx.fillStyle=U.mix('#a32b00','#ff8a2a',w*0.8);
          ctx.fillRect(px,py,ts+1,ts+1);
        }
      }
    }

    /* ---- свечение лавы и неба ---- */
    for(let y=y0;y<=y1;y+=2)for(let x=x0;x<=x1;x+=2){
      if(this.get(x,y)===T.LAVA){
        const g2=ctx.createRadialGradient(x*ts+ts/2,y*ts+ts/2,0,x*ts+ts/2,y*ts+ts/2,ts*2.2);
        g2.addColorStop(0,'rgba(255,120,30,.26)'); g2.addColorStop(1,'rgba(255,120,30,0)');
        ctx.fillStyle=g2; ctx.fillRect(x*ts-ts*2,y*ts-ts*2,ts*5,ts*5);
      }
    }
  },

  drawProp(ctx,p,t){
    const x=p.x, y=p.y, s=p.s||1;
    switch(p.t){
      case 'wreck':{
        ctx.save(); ctx.translate(x,y); ctx.rotate(p.rot*0.2);
        ctx.fillStyle='#2a2420'; ctx.beginPath();
        ctx.moveTo(-26,-14); ctx.lineTo(20,-20); ctx.lineTo(28,-2); ctx.lineTo(-22,6); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='#3d322a'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#151210'; ctx.fillRect(-14,-10,18,10);
        ctx.fillStyle='#c85a1a'; ctx.globalAlpha=.35; ctx.fillRect(-6,-8,6,4); ctx.globalAlpha=1;
        ctx.restore(); break; }
      case 'barrel':{
        ctx.save(); ctx.translate(x,y);
        ctx.fillStyle='#2d3138'; ctx.beginPath(); ctx.ellipse(0,-14,11,16,0,0,6.2832); ctx.fill();
        ctx.fillStyle='#3a4048'; ctx.fillRect(-11,-16,22,12);
        ctx.strokeStyle=p.col; ctx.globalAlpha=.6; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(-11,-8); ctx.lineTo(11,-8); ctx.stroke();
        ctx.globalAlpha=1; ctx.restore(); break; }
      case 'crate':{
        ctx.save(); ctx.translate(x,y);
        ctx.fillStyle='#3b3126'; ctx.fillRect(-13,-26,26,26);
        ctx.strokeStyle='#241d15'; ctx.lineWidth=2; ctx.strokeRect(-13,-26,26,26);
        ctx.strokeStyle='#57483a'; ctx.beginPath(); ctx.moveTo(-13,-26); ctx.lineTo(13,0);
        ctx.moveTo(13,-26); ctx.lineTo(-13,0); ctx.stroke();
        if(p.id) { ctx.fillStyle=p.col; ctx.fillRect(-13,-26,26,3); }
        ctx.restore(); break; }
      case 'fence':{
        ctx.save(); ctx.translate(x,y);
        ctx.strokeStyle='#4a4238'; ctx.lineWidth=3; ctx.lineCap='round';
        for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*10,-24); ctx.lineTo(i*10,-2); ctx.stroke(); }
        ctx.beginPath(); ctx.moveTo(-22,-18); ctx.lineTo(22,-18); ctx.moveTo(-22,-8); ctx.lineTo(22,-8); ctx.stroke();
        ctx.restore(); break; }
      case 'pipe':{
        ctx.save(); ctx.translate(x,y);
        ctx.fillStyle='#2b2a26'; ctx.fillRect(-6,-40,12,40);
        ctx.fillStyle='#3a332c'; ctx.fillRect(-9,-42,18,6);
        ctx.strokeStyle='#6a4a2a'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-6,-30); ctx.lineTo(6,-30); ctx.stroke();
        ctx.restore(); break; }
      case 'furnace':{
        ctx.save(); ctx.translate(x,y);
        ctx.fillStyle='#241a15'; ctx.beginPath(); ctx.moveTo(-22,0); ctx.lineTo(-18,-46);
        ctx.lineTo(18,-46); ctx.lineTo(22,0); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#ff6a1a'; ctx.globalAlpha=.55+Math.sin(t*3+x)*0.15;
        ctx.fillRect(-9,-30,18,16); ctx.globalAlpha=1;
        ctx.strokeStyle='#3a2a20'; ctx.lineWidth=2; ctx.stroke();
        ctx.restore(); break; }
      case 'crystal':{
        ctx.save(); ctx.translate(x,y);
        const g=ctx.createLinearGradient(0,-40,0,0);
        g.addColorStop(0,'rgba(140,233,255,.9)'); g.addColorStop(1,'rgba(60,140,180,.5)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(0,-42); ctx.lineTo(11,-12);
        ctx.lineTo(4,0); ctx.lineTo(-8,-4); ctx.lineTo(-12,-16); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='rgba(200,240,255,.55)'; ctx.lineWidth=1.4; ctx.stroke();
        ctx.restore(); break; }
      case 'shard':{
        ctx.save(); ctx.translate(x,y);
        ctx.fillStyle='rgba(168,107,255,.6)'; ctx.shadowColor='#a86bff'; ctx.shadowBlur=14;
        ctx.beginPath(); ctx.moveTo(0,-38+Math.sin(t*2+x)*4); ctx.lineTo(8,-10);
        ctx.lineTo(0,0); ctx.lineTo(-8,-10); ctx.closePath(); ctx.fill();
        ctx.shadowBlur=0; ctx.restore(); break; }
      case 'vending':{
        ctx.save(); ctx.translate(x,y);
        ctx.fillStyle='#1c2028'; ctx.fillRect(-16,-44,32,44);
        ctx.fillStyle='#0a0b0f'; ctx.fillRect(-12,-40,24,26);
        ctx.fillStyle=p.col; ctx.globalAlpha=.5; ctx.fillRect(-12,-40,24,26); ctx.globalAlpha=1;
        ctx.fillStyle='#2a303a'; ctx.fillRect(-12,-10,24,6);
        ctx.restore(); break; }
      case 'lamp':{
        ctx.save(); ctx.translate(x,y);
        ctx.strokeStyle='#2a2f38'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-64); ctx.stroke();
        ctx.fillStyle='#c8ff1e'; ctx.globalAlpha=.8;
        ctx.beginPath(); ctx.ellipse(0,-68,10,5,0,0,6.2832); ctx.fill();
        ctx.globalAlpha=1;
        const g=ctx.createRadialGradient(0,-68,0,0,-68,90);
        g.addColorStop(0,'rgba(200,255,30,.16)'); g.addColorStop(1,'rgba(200,255,30,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-68,90,0,6.2832); ctx.fill();
        ctx.restore(); break; }
      case 'sign':
      case 'sign2':{
        ctx.save(); ctx.translate(x,y);
        const c=p.col, w=p.w||54, hh=p.h||10;
        ctx.shadowColor=c; ctx.shadowBlur=16;
        ctx.fillStyle=c; ctx.globalAlpha=.75+Math.sin(t*2.4+x*0.05)*0.2;
        ctx.fillRect(-w/2,-hh/2,w,hh);
        ctx.shadowBlur=0; ctx.globalAlpha=1;
        ctx.fillStyle='#0b0c10';
        for(let i=0;i<3;i++) ctx.fillRect(-w/2+6+i*(w/3),-2,6,4);
        ctx.restore(); break; }
    }
  },

  drawObjects(ctx,t){
    for(const o of this.objs){
      const x=o.x,y=o.y;
      if(o.t==='chest'){
        ctx.save(); ctx.translate(x,y);
        if(o.opened){
          ctx.fillStyle='#2a2620'; ctx.fillRect(-14,-16,28,16);
          ctx.fillStyle='#1a1712'; ctx.fillRect(-14,-22,28,8);
        } else {
          ctx.fillStyle='#3d3225'; ctx.fillRect(-14,-20,28,20);
          ctx.fillStyle='#4d4030'; ctx.beginPath(); ctx.moveTo(-14,-20);
          ctx.lineTo(-14,-26); ctx.quadraticCurveTo(0,-38,14,-26); ctx.lineTo(14,-20); ctx.closePath(); ctx.fill();
          ctx.strokeStyle='#c8ff1e'; ctx.lineWidth=2; ctx.strokeRect(-14,-20,28,20);
          ctx.fillStyle='#c8ff1e'; ctx.fillRect(-3,-16,6,8);
          const g=ctx.createRadialGradient(0,-18,0,0,-18,44);
          g.addColorStop(0,'rgba(200,255,30,.18)'); g.addColorStop(1,'rgba(200,255,30,0)');
          ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-18,44,0,6.2832); ctx.fill();
        }
        ctx.restore();
      } else if(o.t==='terminal'||o.t==='shop'||o.t==='board'||o.t==='save'){
        const col = o.t==='terminal'?'#c8ff1e':o.t==='shop'?'#ffe14d':o.t==='board'?'#22e0ff':'#ff2e88';
        ctx.save(); ctx.translate(x,y);
        // корпус
        ctx.fillStyle='#141821'; ctx.fillRect(-26,-58,52,58);
        ctx.strokeStyle='#2b3240'; ctx.lineWidth=2; ctx.strokeRect(-26,-58,52,58);
        // экран
        ctx.fillStyle='#0a0c11'; ctx.fillRect(-21,-53,42,34);
        ctx.shadowColor=col; ctx.shadowBlur=12;
        ctx.fillStyle=col; ctx.globalAlpha=.22+Math.sin(t*3)*0.06;
        ctx.fillRect(-21,-53,42,34); ctx.globalAlpha=1; ctx.shadowBlur=0;
        ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.strokeRect(-21,-53,42,34);
        // пиктограмма
        ctx.fillStyle=col; ctx.font='16px Impact'; ctx.textAlign='center';
        ctx.fillText(o.t==='terminal'?'✦':o.t==='shop'?'$':o.t==='board'?'!':'▮', 0,-30);
        // подпись на плашке
        ctx.font='700 11px "Segoe UI",sans-serif';
        const tw=ctx.measureText(o.label||'').width;
        ctx.fillStyle='rgba(6,8,11,.92)';
        ctx.fillRect(-tw/2-7,-20,tw+14,15);
        ctx.strokeStyle=col; ctx.lineWidth=1; ctx.strokeRect(-tw/2-7,-20,tw+14,15);
        ctx.fillStyle=col;
        ctx.fillText(o.label||'', 0, -9);
        ctx.restore();
      } else if(o.t==='npc'){
        const c=o.npc.color;
        ctx.save(); ctx.translate(x,y);
        ART.shadow(ctx,0,0,12);
        ctx.fillStyle='#1a1e26'; ctx.fillRect(-7,-34,14,26);
        ctx.fillStyle='#d8b48c'; ctx.beginPath(); ctx.arc(0,-40,7,0,6.2832); ctx.fill();
        ctx.fillStyle=c; ctx.fillRect(-7,-34,14,3);
        ctx.restore();
        // маркер
        const b=Math.sin(t*3)*3;
        ctx.fillStyle=c; ctx.font='12px Impact'; ctx.textAlign='center';
        ctx.globalAlpha=.85; ctx.fillText('!', x, y-56+b); ctx.globalAlpha=1;
      }
    }
    // пады телепорта
    for(const p of this.pads){
      ctx.save(); ctx.translate(p.x,p.y);
      const on=G.save.unlockedTP.includes(p.id);
      ctx.strokeStyle=on?'#c8ff1e':'#3a4152'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(0,0,26,12,0,0,6.2832); ctx.stroke();
      ctx.globalAlpha=on?0.35:0.15;
      ctx.fillStyle=on?'#c8ff1e':'#3a4152';
      ctx.beginPath(); ctx.ellipse(0,0,26,12,0,0,6.2832); ctx.fill();
      ctx.globalAlpha=1; ctx.restore();
    }
  },

  minimap(ctx,x,y,w,h,player){
    ctx.save();
    ctx.translate(x,y);
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle='rgba(6,7,10,.92)';
    ctx.fillRect(0,0,w,h);
    const sx=w/this.w, sy=h/this.h;
    // районы
    for(const r of DATA.REGIONS){
      const[ax,ay,aw,ah]=r.rect;
      ctx.fillStyle = r.safe?'rgba(200,255,30,.22)':'rgba(130,150,185,.15)';
      ctx.fillRect(ax*sx,ay*sy,aw*sx,ah*sy);
      ctx.strokeStyle=r.safe?'rgba(200,255,30,.65)':'rgba(130,150,185,.35)';
      ctx.lineWidth=1;
      ctx.strokeRect(ax*sx+.5,ay*sy+.5,aw*sx-1,ah*sy-1);
    }
    // улицы
    ctx.fillStyle='rgba(255,255,255,.10)';
    for(let ty=0;ty<this.h;ty+=1){
      for(let tx=0;tx<this.w;tx+=1){
        if(this.get(tx,ty)===T.ROAD) ctx.fillRect(tx*sx,ty*sy,Math.max(1,sx),Math.max(1,sy));
      }
    }
    // сундуки
    for(const o of this.objs){
      if(o.t==='chest'&&!o.opened){
        ctx.fillStyle='#ffe14d';
        ctx.fillRect(o.x/this.ts*sx-2,o.y/this.ts*sy-2,4,4);
      }
    }
    // боссы
    for(const b of this.bossSpots){
      if(G.save.bossKilled[b.id]) continue;
      ctx.fillStyle='#ff2e88';
      ctx.beginPath(); ctx.arc(b.x/this.ts*sx,b.y/this.ts*sy,3.4,0,6.2832); ctx.fill();
    }
    // враги
    ctx.fillStyle='#ff5252';
    for(const e of CBT.enemies){
      if(e.dead) continue;
      ctx.beginPath(); ctx.arc(e.x/this.ts*sx, e.y/this.ts*sy, e.boss?3:2, 0,6.2832); ctx.fill();
    }
    // игрок — стрелка
    const px=player.x/this.ts*sx, py=player.y/this.ts*sy;
    ctx.save();
    ctx.translate(px,py);
    ctx.rotate((player.aim||0)+Math.PI/2);
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(4.6,4.5); ctx.lineTo(0,2.4); ctx.lineTo(-4.6,4.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#c8ff1e'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.restore();
    ctx.strokeStyle='rgba(200,255,30,.55)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(px,py,8,0,6.2832); ctx.stroke();
    // рамка
    ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1;
    ctx.strokeRect(.5,.5,w-1,h-1);
    ctx.restore();
  },
};

/* ------------------------------------------------------------- ПОГОДА ---- */
const WEATHER = {
  parts:[], mood:'rain', t:0,
  init(mood){
    this.mood=mood; this.parts=[];
    const n = mood==='snow'?120: mood==='ember'?80: mood==='void'?70:110;
    for(let i=0;i<n;i++) this.parts.push(this.mk(true));
  },
  mk(rand){
    const W=eng_w(),H=eng_h();
    return { x:Math.random()*W, y:rand?Math.random()*H:-20,
      vx:this.mood==='snow'?U.rand(14,-14):U.rand(-30,-8),
      vy:this.mood==='ember'?U.rand(-40,-14): this.mood==='void'?U.rand(12,-12): U.rand(320,180),
      s:U.rand(2.2,0.7), a:U.rand(0.5,0.15), life:U.rand(6,2) };
  },
  update(dt){
    const W=eng_w(),H=eng_h();
    for(let i=0;i<this.parts.length;i++){
      const p=this.parts[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(this.mood==='snow') p.x+=Math.sin(this.t+p.y*0.02)*8*dt;
      if(this.mood==='void') p.x+=Math.sin(this.t*0.7+p.y*0.01)*12*dt;
      if(p.y>H+20||p.x<-30||p.x>W+30){ this.parts[i]=this.mk(false); }
    }
    this.t+=dt;
  },
  draw(ctx){
    const m=this.mood;
    const col = m==='rain'?'170,200,230': m==='snow'?'220,240,255':
                m==='ember'?'255,140,50': m==='dust'?'200,170,120':'180,140,255';
    ctx.save();
    if(m==='rain'){
      ctx.strokeStyle=`rgba(${col},.18)`; ctx.lineWidth=1.1;
      ctx.beginPath();
      for(const p of this.parts){ ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-3,p.y+11); }
      ctx.stroke();
    } else {
      for(const p of this.parts){
        ctx.fillStyle=`rgba(${col},${p.a})`;
        if(m==='ember'){ ctx.shadowColor='rgba(255,140,50,.8)'; ctx.shadowBlur=8; }
        ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,6.2832); ctx.fill();
        ctx.shadowBlur=0;
      }
    }
    ctx.restore();
  },
};

/* ------------------------------------------------------------ ФОНЫ/ЭФФЕКТ */
function drawVignette(ctx,W,H,col='#000',amt=0.72){
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.36,W/2,H/2,Math.max(W,H)*0.82);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,U.rgba(col,amt));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function drawScanlines(ctx,W,H){
  ctx.save();
  ctx.globalAlpha=0.05; ctx.fillStyle='#000';
  for(let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
  ctx.restore();
}

</script>
<script>
/* ==== combat.js ==== */
/* ============================================================================
   НОЛЬ-СЕКТОР — БОЙ: цепочки комбо, стихийные реакции, смена агента, ульты
   ========================================================================== */
'use strict';

const CBT = {
  player:null,
  party:[],
  active:0,
  enemies:[], projs:[], zones:[], pickups:[],
  combo:0, comboT:0, sinceHit:9,
  slowmo:0, hitstop:0, flash:0, flashCol:'#fff',
  spawnT:0, ultFx:null, chainFx:null,
  boss:null,
  kills:0,
  screenShake:0,

  /* ------------------------------------------------------------- старт --- */
  init(){
    this.player={
      x:48*MAP.ts, y:20*MAP.ts, vx:0, vy:0, r:14, face:1,
      aim:0, animPhase:Math.random()*6, moving:false, attacking:false,
      hurtFlash:0, atkIdx:0, atkTimer:0, atkQueued:null, atkWindow:0, atkCd:0,
      invuln:0, dodgeCd:0, dodgeT:0, dodgeDir:{x:0,y:0}, skillCd:0, chainCd:0,
      ultT:0, auraGlow:0, dashVx:0, dashVy:0, shield:0, buffT:0, buffAtk:0,
      dead:false, downed:false,
    };
    this.party=G.save.party.slice();
    this.active=0;
    this.enemies=[]; this.projs=[]; this.zones=[]; this.pickups=[];
    this.combo=0; this.comboT=0; this.sinceHit=9; this.boss=null;
    this.syncActive(true);
  },

  char(){ return DATA.CHARS.find(c=>c.id===this.party[this.active]); },
  rt(){ const id=this.party[this.active]; return G.rt[id]; },

  stats(id){
    const c=DATA.CHARS.find(x=>x.id===id||x===id);
    const r=G.save.roster[c.id];
    const lvl=r.level;
    const t=this.treeStats(c.id);
    let hp=c.hp*(1+0.095*(lvl-1));
    let atk=c.atk*(1+0.075*(lvl-1));
    let def=c.def*(1+0.07*(lvl-1));
    hp*=(1+(t.hpPct||0)); atk*=(1+(t.atkPct||0)); def*=(1+(t.defPct||0));
    const tile=r.tiles||{};
    return {
      hp, atk, def, spd:c.spd*(1+(t.spdPct||0)),
      crit:0.05+(t.critUp||0)+(r.cinema||0)*0.01,
      basicMul:1+(t.basicDmg||0)+(Math.max(0,(tile.basic||1)-1)*0.08),
      skillMul:1+(t.skillDmg||0)+(Math.max(0,(tile.skill||1)-1)*0.08),
      chainMul:1+(Math.max(0,(tile.chain||1)-1)*0.06),
      dodgeMul:1+(Math.max(0,(tile.dodge||1)-1)*0.05),
      reactionAmp:t.reactionAmp||0,
