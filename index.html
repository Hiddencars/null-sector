      dazeUp:t.dazeUp||0,
      ultGain:1+(t.ultGain||0),
      tree:t,
      lvl,
    };
  },

  treeStats(id){
    const c=DATA.CHARS.find(x=>x.id===id);
    const r=G.save.roster[id];
    const out={};
    for(const key of Object.keys(c.tree)){
      const node=c.tree[key];
      const lv=(r.nodes&&r.nodes[key])||0;
      if(!lv) continue;
      const per={ basicDmg:0.12, reactionAmp:0.15, dazeUp:0.18, skillDmg:0.16,
                  critUp:0.06, ultGain:0.15 }[node.k];
      if(per!==undefined) out[node.k]=(out[node.k]||0)+per*lv;
      else out[node.k]=1;
    }
    return out;
  },

  syncActive(full){
    const c=this.char(), s=this.stats(c.id), rt=G.rt[c.id];
    this.player.char=c;
    this.player.maxHp=s.hp;
    if(full){ rt.hp=Math.min(rt.hp||s.hp, s.hp); }
    this.player.hp=rt.hp;
    this.player.auraGlow=0;
    if(!full){
      this.player.invuln=Math.max(this.player.invuln,0.45);
      FX.ring(this.player.x,this.player.y,DATA.EL[c.el].c,10,110,0.4,4);
      FX.burst(this.player.x,this.player.y-24,DATA.EL[c.el].c,18,300);
    }
  },

  /* --------------------------------------------------------- ввод/тик --- */
  update(dt){
    if(!this.player) return;
    const p=this.player, c=this.char(), s=this.stats(c.id), rt=G.rt[c.id];
    p.char=c; p.maxHp=s.hp;

    this.sinceHit+=dt;
    this.comboT-=dt;
    if(this.comboT<=0 && this.combo>0){ this.combo=0; }

    // таймеры
    p.hurtFlash=Math.max(0,p.hurtFlash-dt*4);
    p.invuln=Math.max(0,p.invuln-dt);
    p.dodgeCd=Math.max(0,p.dodgeCd-dt);
    p.skillCd=Math.max(0,p.skillCd-dt);
    p.chainCd=Math.max(0,(p.chainCd||0)-dt);
    p.atkWindow=Math.max(0,p.atkWindow-dt);
    p.atkCd=Math.max(0,p.atkCd-dt);
    if(p.attacking && p.atkWindow<=0) p.attacking=false;
    p.buffT=Math.max(0,p.buffT-dt);
    p.auraGlow=Math.max(0,p.auraGlow-dt*2);

    if(this.slowmo>0){ this.slowmo-=dt; }
    if(this.flash>0) this.flash-=dt*2.6;

    // движение
    const ax=INPUT.axis();
    const speed=290*s.spd;
    p.moving=(ax.x!==0||ax.y!==0) && p.dodgeT<=0;

    if(p.dodgeT>0){
      // рывок
      p.dodgeT-=dt;
      p.x+=p.dodgeDir.x*760*dt;
      p.y+=p.dodgeDir.y*760*dt;
      FX.list.push({x:p.x,y:p.y-20,vx:0,vy:0,life:0.3,max:0.3,size:7,
        col:DATA.EL[c.el].c,g:0,drag:1,type:'glow'});
    } else {
      let vx=ax.x*speed, vy=ax.y*speed;
      if(p.dashVx||p.dashVy){ vx=p.dashVx; vy=p.dashVy; p.dashVx*=0.86; p.dashVy*=0.86;
        if(Math.abs(p.dashVx)<12) p.dashVx=0; if(Math.abs(p.dashVy)<12) p.dashVy=0; }
      // плавность
      p.vx=U.lerp(p.vx,vx,Math.min(1,dt*18));
      p.vy=U.lerp(p.vy,vy,Math.min(1,dt*18));
      this.moveEntity(p, p.vx*dt, p.vy*dt);
    }

    // прицел по мыши
    const mw=CAM.screenToWorld(INPUT.mouse.x,INPUT.mouse.y);
    p.aim=U.ang(p.x,p.y,mw.x,mw.y);
    p.face=Math.cos(p.aim)>=0?1:-1;

    // ---- действия
    if(INPUT.hit('KeyJ')||INPUT.mouse.down) this.tryAttack();
    if(INPUT.hit('KeyE')) this.useSkill();
    if(INPUT.hit('KeyQ')) this.useUlt();
    if(INPUT.hit('KeyK')||INPUT.mouse.rdown) this.dodge();
    if(INPUT.hit('KeyF')) this.tryChainAttack();
    for(let i=0;i<3;i++) if(INPUT.hit('Digit'+(i+1))) this.swapTo(i);

    // удар в очереди
    if(p.atkTimer>0){
      p.atkTimer-=dt;
      if(p.atkTimer<=0 && p.atkQueued){ this.resolveHit(p.atkQueued); p.atkQueued=null; }
    }

    // ульта-анимация
    if(this.ultFx){
      this.ultFx.t+=dt;
      if(this.ultFx.t>0.55 && !this.ultFx.hit){
        this.ultFx.hit=true;
        this.applyUltDamage(this.ultFx);
      }
      if(this.ultFx.t>1.3) this.ultFx=null;
    }
    if(this.chainFx){
      this.chainFx.t+=dt;
      if(this.chainFx.t>this.chainFx.dur) this.chainFx=null;
    }

    // пули
    this.updateProjectiles(dt);
    this.updateZones(dt);
    this.updateEnemies(dt);
    this.updatePickups(dt);
    this.spawnTick(dt);

    // аура-дебаффы
    if(rt.hp<=0 && !p.downed) this.downActive();
    p.hp=rt.hp;
  },

  /* ----------------------------------------------------------- движение - */
  moveEntity(e,dx,dy){
    const r=e.r||12;
    if(!MAP.solidAt(e.x+dx,e.y,r)) e.x+=dx; else if(e.dashVx) e.dashVx=0;
    if(!MAP.solidAt(e.x,e.y+dy,r)) e.y+=dy; else if(e.dashVy) e.dashVy=0;
    // границы
    e.x=U.clamp(e.x, MAP.ts, (MAP.w-1)*MAP.ts);
    e.y=U.clamp(e.y, MAP.ts, (MAP.h-1)*MAP.ts);
  },

  /* -------------------------------------------------------------- атаки - */
  tryAttack(){
    const p=this.player, c=this.char();
    if(p.atkCd>0) return;
    if(p.atkTimer>0.02) return;
    const hits=c.basic.hits;
    const extra=(this.treeStats(c.id).core1 && c.id==='volt')?1:0;
    const total=hits.length+extra;
    if(p.atkIdx>=total) p.atkIdx=0;
    p.atkIdx++;
    let h=hits[Math.min(p.atkIdx-1,hits.length-1)];
    if(p.atkIdx>hits.length && extra){ // добавочный удар ядра
      h={d:1.35,r:hits[hits.length-1].r*1.1,arc:2.2,kb:26,dur:0.2,aura:1,daze:24,finisher:true};
    }
    p.atkQueued=JSON.parse(JSON.stringify(h));
    p.atkTimer=h.dur;
    p.atkCd=0.06;
    p.attacking=true;
    p.atkWindow=0.85;
    if(h.proj){ /* снаряд уйдёт при resolveHit */ }
    SFX.hit();
  },

  resolveHit(h){
    const p=this.player, c=this.char(), s=this.stats(c.id), el=DATA.EL[c.el];
    const aim=p.aim;
    // визуал взмаха
    const arcH=h.arc||1.2, rad=h.r||80;
    FX.slash(p.x+Math.cos(aim)*rad*0.35, p.y-22+Math.sin(aim)*rad*0.2,
      aim, arcH, rad*0.9, el.c, 0.2, h.finisher?13:8);

    if(c.basic.ranged){
      this.spawnProjectile({
        x:p.x+Math.cos(aim)*22, y:p.y-22+Math.sin(aim)*12,
        vx:Math.cos(aim)*760, vy:Math.sin(aim)*760,
        r:9, dmg:s.atk*h.d*s.basicMul, el:c.el, from:'player',
        life:0.9, col:el.c, kind:h.proj||'orb', daze:h.daze||6, aura:h.aura||0.6,
        finisher:h.finisher,
      });
      return;
    }

    let hitCount=0;
    for(const e of this.enemies){
      if(e.dead) continue;
      const d=U.dist(p.x,p.y,e.x,e.y);
      if(d>rad+e.r) continue;
      const a=U.ang(p.x,p.y,e.x,e.y);
      if(Math.abs(U.angDiff(aim,a))>arcH/2) continue;
      hitCount++;
      this.hitEnemy(e, s.atk*h.d*s.basicMul, {
        el:c.el, aura:h.aura||0.6, daze:h.daze||6, kb:h.kb||8, crit:s.crit,
        src:'basic', from:{x:p.x,y:p.y},
      });
    }
    if(hitCount) this.registerHit(hitCount);
    if(h.finisher){ CAM.shake(5,0.16); }
  },

  registerHit(n){
    this.sinceHit=0;
    this.combo+=n;
    this.comboT=2.6;
    const c=this.char(), s=this.stats(c.id);
    this.addDec(2.4*s.ultGain*n);
    if(this.combo%5===0) FX.text(this.player.x, this.player.y-70,
      this.combo+' КОМБО', '#ffe600', 15, -30);
  },

  addDec(v){
    const rt=this.rt();
    rt.dec=U.clamp(rt.dec+v,0,100);
    if(rt.dec>=100 && !rt.ultReady){
      rt.ultReady=true;
      SFX.uiBig();
      UI.toast('УЛЬТА ГОТОВА · Q','gold');
    }
    if(rt.dec<100) rt.ultReady=false;
  },

  /* ------------------------------------------------------------- навык -- */
  useSkill(){
    const p=this.player, c=this.char(), s=this.stats(c.id), rt=this.rt();
    if(p.skillCd>0 || p.downed) return;
    const sk=c.skill, el=DATA.EL[sk.el||c.el];
    p.skillCd=sk.cd*(1/(s.dodgeMul||1));
    p.attacking=true; p.atkWindow=0.6;
    CAM.shake(6,0.2);
    SFX.reaction();
    this.addDec(8*s.ultGain);
    const dmgBase=s.atk*(sk.d||1.5)*s.skillMul;

    if(sk.type==='dash'||sk.type==='blink'){
      // рывок сквозь врагов
      const ang=p.aim, dist=sk.type==='blink'?260:300;
      const tx=p.x+Math.cos(ang)*dist, ty=p.y+Math.sin(ang)*dist;
      p.invuln=0.4;
      const steps=6;
      for(let i=1;i<=steps;i++){
        const x=U.lerp(p.x,tx,i/steps), y=U.lerp(p.y,ty,i/steps);
        FX.ring(x,y,el.c,4,40,0.3,3);
        FX.spark(x,y,el.c,3,90,0.3,2);
      }
      p.dashVx=Math.cos(ang)*dist*4; p.dashVy=Math.sin(ang)*dist*4;
      // урон по пути
      for(const e of this.enemies){
        if(e.dead) continue;
        const d=U.dist(p.x,p.y,e.x,e.y);
        if(d>dist*0.85) continue;
        const a=U.ang(p.x,p.y,e.x,e.y);
        if(Math.abs(U.angDiff(ang,a))>0.85) continue;
        for(let i=0;i<(sk.hits||1);i++){
          setTimeout(()=>{ if(!e.dead) this.hitEnemy(e, dmgBase*0.42, {
            el:c.el, aura:0.9, daze:sk.daze||10, kb:10, crit:s.crit, src:'skill',
            from:{x:p.x,y:p.y} }); }, i*70);
        }
      }
      FX.ring(p.x,p.y,el.c,20,240,0.5,6);
    }
    else if(sk.type==='aoe'){
      const R=sk.radius||150;
      FX.ring(p.x,p.y,el.c,20,R,0.45,8);
      FX.burst(p.x,p.y,el.c,22,340);
      for(const e of this.enemies){
        if(e.dead) continue;
        if(U.dist(p.x,p.y,e.x,e.y)>R+e.r) continue;
        this.hitEnemy(e, dmgBase, { el:c.el, aura:1, daze:sk.daze||20, kb:34,
          crit:s.crit, src:'skill', from:{x:p.x,y:p.y} });
        if(sk.stun) e.stunT=Math.max(e.stunT,sk.stun);
      }
      CAM.shake(9,0.28);
      SFX.heavy();
    }
    else if(sk.type==='ring'){
      const R=sk.radius||180;
      for(let i=0;i<3;i++) setTimeout(()=>FX.ring(p.x,p.y,el.c,20+i*30,R,0.45,5), i*80);
      for(const e of this.enemies){
        if(e.dead) continue;
        if(U.dist(p.x,p.y,e.x,e.y)>R+e.r) continue;
        this.hitEnemy(e, dmgBase, { el:c.el, aura:1, daze:sk.daze||18, kb:40,
          crit:s.crit, src:'skill', from:{x:p.x,y:p.y} });
      }
      CAM.shake(7,0.25);
    }
    else if(sk.type==='wall'){
      const len=sk.len||200, ang=p.aim;
      for(let i=0;i<5;i++){
        const t=(i/4-0.5)*len;
        this.zones.push({x:p.x+Math.cos(ang)*t+Math.cos(ang)*40,
          y:p.y+Math.sin(ang)*t+Math.sin(ang)*40,
          r:40, t:0, dur:5, dps:s.atk*0.34, el:c.el, col:el.c, kind:'fire'});
      }
      FX.ring(p.x,p.y,el.c,20,len*0.6,0.4,5);
      CAM.shake(5,0.2);
    }
    else if(sk.type==='pull'){
      const R=sk.radius||170;
      for(const e of this.enemies){
        if(e.dead) continue;
        const d=U.dist(p.x,p.y,e.x,e.y);
        if(d>R+e.r) continue;
        const a=U.ang(e.x,e.y,p.x,p.y);
        e.x+=Math.cos(a)*70; e.y+=Math.sin(a)*70;
        this.hitEnemy(e, dmgBase*0.7, { el:c.el, aura:1, daze:sk.daze||16, kb:0,
          crit:s.crit, src:'skill', from:{x:p.x,y:p.y} });
      }
      FX.ring(p.x,p.y,el.c,R,20,0.4,6);
      setTimeout(()=>{
        for(const e of this.enemies){
          if(e.dead) continue;
          if(U.dist(p.x,p.y,e.x,e.y)>R*0.8) continue;
          this.hitEnemy(e, dmgBase*0.8, { el:c.el, aura:0.8, daze:12, kb:26,
            crit:s.crit, src:'skill', from:{x:p.x,y:p.y} });
        }
        FX.slash(p.x,p.y-22,p.aim,3.6,R*0.8,el.c,0.25,16);
      },180);
    }
    else if(sk.type==='buff'){
      const R=sk.radius||200;
      p.buffT=8; p.buffAtk=0.25;
      G.rt[c.id].hp=Math.min(G.rt[c.id].hp+s.hp*0.12, s.hp);
      for(const id of this.party){
        const st=this.stats(id);
        G.rt[id].hp=Math.min(G.rt[id].hp+st.hp*0.08, st.hp);
      }
      this.addDec(15*s.ultGain);
      FX.ring(p.x,p.y,el.c,10,R,0.7,5);
      FX.burst(p.x,p.y-24,el.c,26,220);
      UI.toast('РЕЗОНАНС · +25% АТК на 8 с','gold');
      for(const e of this.enemies){
        if(e.dead) continue;
        if(U.dist(p.x,p.y,e.x,e.y)>R+e.r) continue;
        this.hitEnemy(e, s.atk*0.8, { el:c.el, aura:1, daze:10, kb:16, crit:s.crit,
          src:'skill', from:{x:p.x,y:p.y} });
      }
    }
    else if(sk.type==='shield'){
      const R=sk.radius||130;
      p.shield=Math.max(p.shield, s.hp*0.22);
      FX.ring(p.x,p.y,el.c,10,R,0.5,6);
      for(const e of this.enemies){
        if(e.dead) continue;
        if(U.dist(p.x,p.y,e.x,e.y)>R+e.r) continue;
        this.hitEnemy(e, dmgBase, { el:c.el, aura:1, daze:sk.daze||20, kb:30,
          crit:s.crit, src:'skill', from:{x:p.x,y:p.y} });
      }
      UI.toast('БАСТИОН · щит '+Math.round(s.hp*0.22),'gold');
      CAM.shake(7,0.2);
    }
    p.auraGlow=1;
  },

  /* -------------------------------------------------------------- ульта - */
  useUlt(){
    const p=this.player, c=this.char(), s=this.stats(c.id), rt=this.rt();
    if(rt.dec<100 || p.ultT>0) return;
    rt.dec=0; rt.ultReady=false;
    p.ultT=1.4; p.invuln=1.5;
    this.ultFx={t:0, hit:false, char:c, atk:s.atk, crit:s.crit, mul:s.chainMul};
    this.slowmo=0.45;
    this.flash=1; this.flashCol=DATA.EL[c.el].c;
    CAM.shake(14,0.6);
    SFX.ult();
    UI.toast('『'+c.ult.name+'』','gold');
    for(let i=0;i<3;i++) setTimeout(()=>FX.ring(p.x,p.y,DATA.EL[c.el].c,20,300+i*60,0.6,6),i*120);
  },

  applyUltDamage(u){
    const p=this.player, c=u.char, el=DATA.EL[c.el];
    const R=340;
    FX.burst(p.x,p.y,el.c,60,520);
    CAM.shake(16,0.5);
    SFX.heavy();
    const n=6;
    for(let i=0;i<n;i++){
      setTimeout(()=>{
        for(const e of this.enemies){
          if(e.dead) continue;
          if(U.dist(p.x,p.y,e.x,e.y)>R+e.r) continue;
          this.hitEnemy(e, u.atk*c.ult.d*0.28*u.mul, { el:c.el, aura:1, daze:20,
            kb:18, crit:u.crit+0.15, src:'chain', from:{x:p.x,y:p.y} });
          FX.spark(e.x,e.y-20,el.c,8,240,0.5,3);
        }
        FX.ring(p.x,p.y,el.c,40+i*40,R,0.4,5);
      }, i*90);
    }
    // хил команды от эфирных
    if(c.id==='eho'){
      for(const id of this.party){
        const st=this.stats(id);
        G.rt[id].hp=Math.min(G.rt[id].hp+st.hp*0.35, st.hp);
      }
    }
    if(c.id==='iney'){ // заморозка
      for(const e of this.enemies){
        if(!e.dead && U.dist(p.x,p.y,e.x,e.y)<R) e.frozen=Math.max(e.frozen,3);
      }
    }
    if(c.id==='pepel'){ // горение земли
      for(let i=0;i<6;i++){
        const a=i/6*6.283;
        this.zones.push({x:p.x+Math.cos(a)*150,y:p.y+Math.sin(a)*150,r:70,t:0,dur:5,
          dps:u.atk*0.3,el:'fire',col:'#ff4d1a',kind:'fire'});
      }
    }
  },

  /* ------------------------------------------------------- цепная атака - */
  tryChainAttack(){
    const p=this.player, c=this.char(), s=this.stats(c.id);
    // ищем оглушённого врага
    let target=null, best=1e9;
    for(const e of this.enemies){
      if(e.dead||e.stunT<=0) continue;
      const d=U.dist(p.x,p.y,e.x,e.y);
      if(d<420 && d<best){ best=d; target=e; }
    }
    if(!target){ UI.toast('Нет оглушённой цели','warn'); return; }
    if(p.chainCd>0) return;
    p.chainCd=1.2;
    this.slowmo=0.3;
    this.chainFx={t:0,dur:0.9,target,char:c};
    CAM.shake(10,0.4);
    SFX.reaction();
    const el=DATA.EL[c.el];
    // телепорт к цели
    const a=U.ang(target.x,target.y,p.x,p.y);
    p.x=target.x+Math.cos(a)*70; p.y=target.y+Math.sin(a)*70;
    for(let i=0;i<6;i++){
      setTimeout(()=>{
        if(target.dead) return;
        this.hitEnemy(target, s.atk*0.55*s.chainMul, { el:c.el, aura:1, daze:0,
          kb:6, crit:s.crit+0.2, src:'chain', from:{x:p.x,y:p.y} });
        FX.slash(target.x,target.y-20,Math.random()*6.28,2.4,90,el.c,0.22,10);
      }, i*95);
    }
    this.addDec(22*s.ultGain);
    this.combo+=6; this.comboT=3;
    UI.toast('ЦЕПНАЯ АТАКА','gold');
  },

  /* ------------------------------------------------------------- уклон - */
  dodge(){
    const p=this.player;
    if(p.dodgeCd>0) return;
    const ax=INPUT.axis();
    let dx=ax.x, dy=ax.y;
    if(!dx&&!dy){ dx=Math.cos(p.aim); dy=Math.sin(p.aim); }
    const len=Math.hypot(dx,dy)||1;
    p.dodgeDir={x:dx/len,y:dy/len};
    p.dodgeT=0.22;
    p.dodgeCd=0.85;
    p.invuln=0.34;
    p.attacking=false;
    FX.ring(p.x,p.y,'#ffffff',6,44,0.3,3);
    SFX.dodge();
    // идеальный уклон: если рядом летит снаряд
    let perfect=false;
    for(const pr of this.projs){
      if(pr.from!=='enemy') continue;
      if(U.dist(pr.x,pr.y,p.x,p.y)<70) perfect=true;
    }
    for(const e of this.enemies){
      if(!e.dead && e.wind>0 && e.wind<0.2 && U.dist(e.x,e.y,p.x,p.y)<e.r+70) perfect=true;
    }
    if(perfect){
      this.slowmo=0.32;
      this.addDec(14);
      this.combo+=2; this.comboT=2.6;
      FX.text(p.x,p.y-64,'ИДЕАЛЬНО','#22e0ff',15,-40);
      SFX.crit();
    }
  },

  /* ------------------------------------------------------------ смена --- */
  swapTo(i){
    if(i===this.active || i<0 || i>=this.party.length) return;
    const id=this.party[i], rt=G.rt[id];
    if(rt.hp<=0) { UI.toast('Агент выведен из строя','warn'); return; }
    const chain = this.sinceHit<0.55 || this.player.attacking;
    this.active=i;
    this.syncActive(false);
    SFX.swap();
    if(chain) this.chainSwap();
    UI.refreshTeam();
  },

  chainSwap(){
    const p=this.player, c=this.char(), s=this.stats(c.id), el=DATA.EL[c.el];
    p.invuln=Math.max(p.invuln,0.3);
    this.slowmo=0.18;
    this.addDec(10*s.ultGain);
    FX.ring(p.x,p.y,el.c,10,150,0.4,5);
    FX.burst(p.x,p.y-22,el.c,20,300);
    CAM.shake(6,0.2);
    let hits=0;
    for(const e of this.enemies){
      if(e.dead) continue;
      if(U.dist(p.x,p.y,e.x,e.y)>160+e.r) continue;
      hits++;
      // гарантированная реакция при смене элемента
      this.hitEnemy(e, s.atk*1.05*s.chainMul, { el:c.el, aura:1, daze:16, kb:18,
        crit:s.crit, src:'chain', from:{x:p.x,y:p.y} });
      if(c.id==='volt' && this.treeStats(c.id).core2){
        this.zones.push({x:e.x,y:e.y,r:60,t:0,dur:0.4,dps:s.atk*0.6,el:'elec',
          col:'#a86bff',kind:'zap'});
      }
    }
    if(hits){ this.combo+=hits; this.comboT=2.8; FX.text(p.x,p.y-72,'СЦЕПКА','#c8ff1e',16,-40); }
  },

  /* ------------------------------------------------------------ урон ---- */
  hitEnemy(e, rawDmg, o={}){
    if(e.dead) return 0;
    const defF=1-e.dfn/(e.dfn+340);
    let dmg=rawDmg*defF;
    if(e.defDown>0) dmg*=1/(1-e.defDown);
    let crit=false;
    if(o.crit && Math.random()<o.crit){ crit=true; dmg*=1.85; }
    if(e.frozen>0) dmg*=1.8;
    if(e.stunT>0) dmg*=1.45;
    dmg*=1+Math.min(this.combo,25)*0.025;

    e.hp-=dmg;
    e.hurtFlash=0.16;
    e.flashT=0.1;
    // отброс
    if(o.kb && e.kbResist!==1){
      const a=U.ang(o.from?o.from.x:e.x, o.from?o.from.y:e.y, e.x, e.y);
      e.kx=Math.cos(a)*o.kb*7; e.ky=Math.sin(a)*o.kb*7;
    }
    // шкала оглушения
    if(o.daze){
      const c=this.char();
      const dazeUp=this.stats(c.id).dazeUp;
      e.daze+=o.daze*(1+dazeUp);
      if(e.daze>=e.dazeMax && e.stunT<=0){
        e.daze=0;
        e.stunT=e.boss?1.6:3.2;
        FX.text(e.x,e.y-e.r*2.2,'ОГЛУШЁН','#ffe600',17,-46);
        FX.ring(e.x,e.y,'#ffe600',10,70,0.5,5);
        CAM.shake(6,0.2);
        SFX.heavy();
      }
    }
    // стихия
    if(o.el && o.aura>0) this.applyAura(e, o.el, o.aura);
    // цифры
    FX.text(e.x+U.rand(12,-12), e.y-e.r*1.9, Math.round(dmg).toString(),
      crit?'#ffdf3d':'#ffffff', crit?22:16, -56, crit);
    FX.spark(e.x,e.y-e.r, o.el?DATA.EL[o.el].c:'#fff', crit?10:5, crit?260:170, 0.35, 2.4);
    if(crit) SFX.crit(); else SFX.hit();
    if(crit||dmg>400) CAM.shake(crit?7:4,0.14);

    if(e.hp<=0) this.killEnemy(e);
    return dmg;
  },

  applyAura(e, elId, strength){
    const cur=e.aura;
    if(cur && cur.el!==elId){
      const r=DATA.getReaction(cur.el, elId);
      if(r){ this.doReaction(e, r, cur.el, elId); }
      e.aura={el:elId,t:Math.max(4,8*strength)*0.7};
    } else {
      e.aura={el:elId,t:Math.max(cur?cur.t:0, 8*strength)};
    }
  },

  doReaction(e, r, elA, elB){
    const c=this.char(), s=this.stats(c.id);
    const amp=1+s.reactionAmp;
    let dmg=s.atk*r.dmg*amp*(1+Math.min(this.combo,25)*0.02);
    if(c.id==='lyumen' && this.treeStats(c.id).core2) dmg*=2;

    e.hp-=dmg;
    e.hurtFlash=0.2;
    FX.text(e.x,e.y-e.r*2.4, r.n, r.c, 20, -70);
    FX.text(e.x+U.rand(14,-14),e.y-e.r*1.6, Math.round(dmg).toString(), r.c, 18, -50);
    FX.ring(e.x,e.y,r.c,10,120,0.5,6);
    FX.burst(e.x,e.y-e.r,r.c,26,380);
    CAM.shake(9,0.26);
    SFX.reaction();
    this.combo+=3; this.comboT=3.2;
    this.addDec(7*s.ultGain);
    G.save.stats.reactions=(G.save.stats.reactions||0)+1;

    const R=r.aoe||0;
    if(R>0){
      for(const o of this.enemies){
        if(o===e||o.dead) continue;
        if(U.dist(e.x,e.y,o.x,o.y)>R) continue;
        o.hp-=dmg*0.45;
        o.hurtFlash=0.15;
        FX.text(o.x,o.y-o.r*1.8,Math.round(dmg*0.45),r.c,13,-40);
        if(o.hp<=0) this.killEnemy(o);
      }
      FX.ring(e.x,e.y,r.c,20,R,0.45,5);
    }
    if(r.fx==='groundfire'){
      for(let i=0;i<3;i++){
        const a=Math.random()*6.283, d=U.rand(R,R*0.3);
        this.zones.push({x:e.x+Math.cos(a)*d,y:e.y+Math.sin(a)*d,r:50,t:0,dur:5,
          dps:s.atk*0.34,el:'fire',col:'#ff8a3d',kind:'fire'});
      }
    }
    if(r.dot){ e.dot={dps:s.atk*r.dot, t:r.dur||6, el:elB}; }
    if(r.def!==undefined){ e.defDown=r.def; e.defDownT=r.dur||8; }
    if(r.atkDown!==undefined){ e.atkDown=r.atkDown; e.atkDownT=r.dur||8; }
    if(r.freeze||r.stun){ e.frozen=Math.max(e.frozen,r.freeze||0); e.stunT=Math.max(e.stunT,r.stun||0); }
    if(r.fx==='chain'){
      let n=0;
      const others=this.enemies.filter(o=>o!==e&&!o.dead)
        .sort((a,b)=>U.dist(e.x,e.y,a.x,a.y)-U.dist(e.x,e.y,b.x,b.y)).slice(0,r.targets||3);
      for(const o of others){
        o.hp-=dmg*0.65; o.hurtFlash=0.16;
        FX.text(o.x,o.y-o.r*1.8,Math.round(dmg*0.65),r.c,13,-40);
        FX.slash((e.x+o.x)/2,(e.y+o.y)/2,U.ang(e.x,e.y,o.x,o.y),0.4,120,r.c,0.25,5);
        if(o.hp<=0) this.killEnemy(o);
        n++;
      }
    }
    if(r.fx==='shatter' && e.frozen>0){ e.frozen=0; e.hp-=dmg*r.bonus; }
    if(e.hp<=0) this.killEnemy(e);
  },

  killEnemy(e){
    if(e.dead) return;
    e.dead=true;
    this.kills++;
    FX.burst(e.x,e.y-e.r,DATA.EL[e.def.el].c,e.boss?60:18,e.boss?500:260);
    FX.ring(e.x,e.y,DATA.EL[e.def.el].c,10,e.r*3,0.5,4);
    CAM.shake(e.boss?18:4, e.boss?0.7:0.15);
    SFX.die();
    this.addDec(e.boss?40:5);
    this.combo+=e.boss?10:1; this.comboT=3;

    // награды
    const lvlMul=1+0.18*(e.lvl-1);
    const xp=Math.round(e.def.xp*lvlMul*(e.boss?1:1));
    const cr=Math.round(e.def.cr*lvlMul);
    G.save.credits+=cr;
    G.save.stats.kills=(G.save.stats.kills||0)+1;
    // опыт всей команде
    for(const id of this.party){
      this.gainXp(id, Math.round(xp*(id===this.party[this.active]?1:0.6)));
    }
    // дроп
    this.pickups.push({x:e.x,y:e.y,vx:U.rand(60,-60),vy:U.rand(-40,-120),t:0,
      kind:'credits',v:cr,col:'#bfc9d8'});
    if(Math.random()<0.28||e.boss){
      this.pickups.push({x:e.x,y:e.y,vx:U.rand(60,-60),vy:U.rand(-40,-120),t:0,
        kind:'eth',v:e.boss?120:20,col:'#ffe14d'});
    }
    if(Math.random()<0.18||e.boss){
      this.pickups.push({x:e.x,y:e.y,vx:U.rand(60,-60),vy:U.rand(-40,-120),t:0,
        kind:'chip',v:e.boss?3:1,col:'#c8ff1e'});
    }
    FX.text(e.x,e.y-e.r*2,'+'+cr+' КР','#bfc9d8',13,-44);

    if(e.boss){
      G.save.bossKilled[e.bossId]=true;
      this.boss=null;
      G.save.eth+=120; G.save.sp+=2;
      UI.toast('БОСС ПОВЕРЖЕН · +120 эфиритов, +2 SP','gold');
      G.save.stats.bosses=(G.save.stats.bosses||0)+1;
      Store.save();
    }
    // задания
    QM.onKill(e);
  },

  gainXp(id, amount){
    const r=G.save.roster[id];
    if(!r) return;
    r.xp+=amount;
    let need=DATA.XP_TABLE(r.level);
    let ups=0;
    while(r.xp>=need && r.level<60){
      r.xp-=need; r.level++; ups++;
      need=DATA.XP_TABLE(r.level);
    }
    if(ups){
      G.save.sp+=ups;
      const c=DATA.CHARS.find(x=>x.id===id);
      UI.toast(c.name+' · ур. '+r.level+' (+'+ups+' SP)','gold');
      SFX.levelup();
      if(id===this.party[this.active]){
        const s=this.stats(id);
        G.rt[id].hp=Math.min(G.rt[id].hp+s.hp*0.3, s.hp);
        this.syncActive(false);
      }
    }
  },

  /* ------------------------------------------------------------ игрок --- */
  hurtPlayer(dmg, srcEl){
    const p=this.player, c=this.char(), s=this.stats(c.id), rt=this.rt();
    if(p.invuln>0||p.downed) return;
    if(p.shield>0){
      const absorb=Math.min(p.shield,dmg);
      p.shield-=absorb; dmg-=absorb;
      FX.ring(p.x,p.y,'#cfd8e6',10,40,0.3,4);
      FX.text(p.x,p.y-58,'ЩИТ','#cfd8e6',12,-30);
      if(dmg<=0){ SFX.hurt(); CAM.shake(4,0.12); return; }
    }
    const defF=1-s.def/(s.def+420);
    dmg*=defF;
    rt.hp-=dmg;
    p.hurtFlash=1;
    p.invuln=0.55;
    CAM.shake(8,0.3);
    this.flash=0.5; this.flashCol='#ff2222';
    SFX.hurt();
    FX.text(p.x,p.y-58,'-'+Math.round(dmg),'#ff5a5a',17,-50);
    this.combo=0;
    if(rt.hp<=0) this.downActive();
    p.hp=rt.hp;
  },

  downActive(){
    const p=this.player, id=this.party[this.active];
    G.rt[id].hp=0;
    p.downed=true;
    FX.burst(p.x,p.y-20,'#ff3b30',30,300);
    UI.toast(DATA.CHARS.find(c=>c.id===id).name+' выведен из строя','warn');
    // ищем живого
    for(let i=0;i<this.party.length;i++){
      if(G.rt[this.party[i]].hp>0){
        this.active=i; p.downed=false; this.syncActive(true);
        UI.refreshTeam();
        return;
      }
    }
    this.wipe();
  },

  wipe(){
    UI.toast('КОМАНДА УНИЧТОЖЕНА · возврат в Кайрос','warn');
    this.player.x=48*MAP.ts; this.player.y=20*MAP.ts;
    for(const id of this.party){
      const s=this.stats(id);
      G.rt[id].hp=s.hp*0.5; G.rt[id].dec=0;
    }
    this.enemies=[]; this.projs=[]; this.zones=[];
    this.player.downed=false;
    this.syncActive(true);
    G.save.stats.deaths=(G.save.stats.deaths||0)+1;
    UI.refreshTeam();
    Store.save();
  },

  /* ----------------------------------------------------------- снаряды -- */
  spawnProjectile(o){
    this.projs.push(Object.assign({life:1.2,homing:0,trail:[]},o));
  },

  updateProjectiles(dt){
    const p=this.player;
    for(let i=this.projs.length-1;i>=0;i--){
      const pr=this.projs[i];
      pr.life-=dt;
      if(pr.homing>0){
        const tx=p.x,ty=p.y-20;
        const a=U.ang(pr.x,pr.y,tx,ty);
        const ca=U.ang(0,0,pr.vx,pr.vy);
        const na=ca+U.angDiff(ca,a)*Math.min(1,pr.homing*dt);
        const sp=Math.hypot(pr.vx,pr.vy);
        pr.vx=Math.cos(na)*sp; pr.vy=Math.sin(na)*sp;
      }
      pr.x+=pr.vx*dt; pr.y+=pr.vy*dt;
      if(pr.life<=0||MAP.solidAt(pr.x,pr.y,4)){ this.projs.splice(i,1); continue; }

      if(pr.from==='player'){
        for(const e of this.enemies){
          if(e.dead) continue;
          if(U.dist(pr.x,pr.y,e.x,e.y)<e.r+pr.r){
            this.hitEnemy(e, pr.dmg, { el:pr.el, aura:pr.aura, daze:pr.daze||6,
              kb:8, crit:0.08, src:'basic', from:{x:pr.x,y:pr.y} });
            FX.burst(pr.x,pr.y,pr.col,10,200);
            this.registerHit(1);
            this.projs.splice(i,1);
            break;
          }
        }
      } else {
        if(U.dist(pr.x,pr.y,p.x,p.y-16)<p.r+pr.r){
          this.hurtPlayer(pr.dmg, pr.el);
          FX.burst(pr.x,pr.y,pr.col,10,200);
          this.projs.splice(i,1);
        }
      }
    }
  },

  updateZones(dt){
    const p=this.player;
    for(let i=this.zones.length-1;i>=0;i--){
      const z=this.zones[i];
      z.t+=dt;
      if(z.t>z.dur){ this.zones.splice(i,1); continue; }
      if(z.tick===undefined) z.tick=0;
      z.tick-=dt;
      if(z.tick>0) continue;
      z.tick=0.5;
      // зоны бьют врагов (игрока, если это зона врага)
      if(z.hostile){
        if(U.dist(p.x,p.y,z.x,z.y)<z.r) this.hurtPlayer(z.dps*0.5);
      } else {
        for(const e of this.enemies){
          if(e.dead) continue;
          if(U.dist(e.x,e.y,z.x,z.y)>z.r+e.r*0.5) continue;
          this.hitEnemy(e, z.dps*0.5, { el:z.el, aura:0.35, daze:2, kb:0,
            crit:0.05, src:'skill', from:{x:z.x,y:z.y} });
        }
      }
    }
  },

  updatePickups(dt){
    const p=this.player;
    for(let i=this.pickups.length-1;i>=0;i--){
      const k=this.pickups[i];
      k.t+=dt;
      k.x+=k.vx*dt; k.y+=k.vy*dt;
      k.vx*=0.94; k.vy*=0.94;
      const d=U.dist(k.x,k.y,p.x,p.y-20);
      if(d<110){
        const a=U.ang(k.x,k.y,p.x,p.y-20);
        k.x+=Math.cos(a)*380*dt; k.y+=Math.sin(a)*380*dt;
      }
      if(d<26){
        if(k.kind==='credits'){ G.save.credits+=k.v; }
        if(k.kind==='eth'){ G.save.eth+=k.v; }
        if(k.kind==='chip'){ G.save.chips+=k.v; }
        if(k.kind==='sp'){ G.save.sp+=k.v; }
        FX.text(p.x,p.y-70,'+'+k.v+' '+({credits:'КР',eth:'ЭФ',chip:'ЧП',sp:'SP'})[k.kind],k.col,13,-40);
        SFX.pickup();
        this.pickups.splice(i,1);
      }
    }
  },

  /* ------------------------------------------------------------- враги -- */
  spawnEnemy(type,x,y,lvl,isBoss,id){
    const def=DATA.ENEMIES[type];
    if(!def) return null;
    const L=lvl||def.lvl||1;
    const hpMul=1+0.34*(L-1);
    const atkMul=1+0.2*(L-1);
    const e={
      type, def, boss:!!def.boss, bossId:id, elite:!!def.elite,
      x, y, r:def.r, face:1, seed:Math.random()*6.28,
      hp:def.hp*hpMul, maxHp:def.hp*hpMul,
      atk:def.atk*atkMul,
      spd:def.spd*(1+0.02*(L-1)), lvl:L,
      daze:0, dazeMax: def.boss?520: def.elite?220:100,
      stunT:0, frozen:0, aura:null, dot:null,
      defDown:0, defDownT:0, atkDown:0, atkDownT:0,
      kx:0, ky:0, hurtFlash:0, dead:false, wind:0, atkCd:U.rand(1.6,0.3),
      state:'idle', t:Math.random()*6, charge:0, special:U.rand(5,3),
      kbResist: def.boss?1:0, target:null,
      dfn: def.def*(1+0.18*(L-1)),
    };
    this.enemies.push(e);
    if(e.boss) this.boss=e;
    return e;
  },

  updateEnemies(dt){
    const p=this.player, c=this.char();
    for(const e of this.enemies){
      if(e.dead) continue;
      e.t+=dt;
      e.hurtFlash=Math.max(0,e.hurtFlash-dt*5);
      e.stunT=Math.max(0,e.stunT-dt);
      e.frozen=Math.max(0,e.frozen-dt);
      e.defDownT=Math.max(0,e.defDownT-dt); if(e.defDownT<=0) e.defDown=0;
      e.atkDownT=Math.max(0,e.atkDownT-dt); if(e.atkDownT<=0) e.atkDown=0;
      if(e.aura){ e.aura.t-=dt; if(e.aura.t<=0) e.aura=null; }
      if(e.dot){ e.dot.t-=dt; if(e.dot.t<=0) e.dot=null;
        else if(e.dot.tick===undefined||(e.dot.tick-=dt)<=0){
          e.dot.tick=1; e.hp-=e.dot.dps; e.hurtFlash=0.08;
          FX.text(e.x+U.rand(8,-8),e.y-e.r*1.6,Math.round(e.dot.dps),
            DATA.EL[e.dot.el||'fire'].c,11,-30);
          if(e.hp<=0){ this.killEnemy(e); continue; }
        }
      }
      // отброс
      if(e.kx||e.ky){
        this.moveEntity(e,e.kx*dt,e.ky*dt);
        e.kx*=0.86; e.ky*=0.86;
        if(Math.abs(e.kx)<6) e.kx=0;
        if(Math.abs(e.ky)<6) e.ky=0;
      }
      if(e.stunT>0||e.frozen>0) continue;

      const d=U.dist(e.x,e.y,p.x,p.y);
      const a=U.ang(e.x,e.y,p.x,p.y);
      e.face=Math.cos(a)>=0?1:-1;
      const spd=e.spd*(1-(e.atkDown||0)*0.4);

      // агрессия
      if(d>620 && !e.boss){ continue; }

      switch(e.def.ai){
        case 'chase': {
          if(d>e.r+34){ this.moveEntity(e, Math.cos(a)*spd*dt, Math.sin(a)*spd*dt); }
          e.atkCd-=dt;
          if(d<e.r+44 && e.atkCd<=0 && e.wind<=0){ e.wind=0.42; e.atkCd=U.rand(2.2,1.1); }
          break; }
        case 'ranged': {
          const ideal=230;
          if(d>ideal+40){ this.moveEntity(e, Math.cos(a)*spd*dt, Math.sin(a)*spd*dt); }
          else if(d<ideal-60){ this.moveEntity(e, -Math.cos(a)*spd*dt, -Math.sin(a)*spd*dt); }
          e.atkCd-=dt;
          if(e.atkCd<=0 && d<430){ e.wind=0.5; e.atkCd=U.rand(2.8,1.7); }
          break; }
        case 'charge': {
          if(e.charge>0){
            e.charge-=dt;
            this.moveEntity(e, Math.cos(e.chargeA)*520*dt, Math.sin(e.chargeA)*520*dt);
            if(d<e.r+40) this.hurtPlayer(e.atk*0.8, e.def.el);
            continue;
          }
          if(d>70) this.moveEntity(e, Math.cos(a)*spd*dt, Math.sin(a)*spd*dt);
          e.atkCd-=dt;
          if(e.atkCd<=0 && d<340){ e.wind=0.55; e.atkCd=U.rand(3.4,2.2);
            e.chargeA=a; e.chargePending=true; }
          break; }
        case 'brute': {
          if(d>e.r+50) this.moveEntity(e, Math.cos(a)*spd*dt, Math.sin(a)*spd*dt);
          e.atkCd-=dt;
          if(d<e.r+80 && e.atkCd<=0 && e.wind<=0){ e.wind=0.75; e.atkCd=U.rand(3.2,2.2); }
          break; }
        case 'boss': {
          e.special-=dt;
          if(d>e.r+60) this.moveEntity(e, Math.cos(a)*spd*dt, Math.sin(a)*spd*dt);
          e.atkCd-=dt;
          if(e.atkCd<=0 && d<e.r+130){ e.wind=0.7; e.atkCd=U.rand(2.6,1.7); }
          if(e.special<=0){
            e.special=U.rand(7,4.5);
            const hpK=e.hp/e.maxHp;
            if(hpK<0.5 && Math.random()<0.5){
              // кольцо снарядов
              for(let i=0;i<10;i++){
                const ang=i/10*6.283+e.t;
                this.spawnProjectile({x:e.x,y:e.y-30,vx:Math.cos(ang)*230,vy:Math.sin(ang)*230,
                  r:10,dmg:e.atk*0.55,el:e.def.el,from:'enemy',life:2.4,
                  col:DATA.EL[e.def.el].c,kind:'orb'});
              }
              FX.ring(e.x,e.y-20,DATA.EL[e.def.el].c,20,180,0.5,5);
            } else {
              // рывок
              e.charge=0.5; e.chargeA=a;
              FX.ring(e.x,e.y,DATA.EL[e.def.el].c,20,120,0.4,4);
            }
          }
          break; }
      }

      // телеграф → удар
      if(e.wind>0){
        e.wind-=dt;
        if(e.wind<=0){
          const reach = e.def.ai==='brute'||e.def.ai==='boss' ? e.r+95 : e.r+55;
          if(e.chargePending){ e.chargePending=false; e.charge=0.42; }
          if(e.def.atkType==='proj'||e.def.atkType==='homing'){
            this.spawnProjectile({x:e.x,y:e.y-e.r*0.8,
              vx:Math.cos(a)*300,vy:Math.sin(a)*300,r:9,
              dmg:e.atk,el:e.def.el,from:'enemy',life:2.6,
              col:DATA.EL[e.def.el].c,kind:'orb',homing:e.def.atkType==='homing'?1.6:0});
          } else if(e.def.atkType==='aoe'){
            this.zones.push({x:p.x,y:p.y,r:70,t:0,dur:0.8,dps:e.atk*1.2,
              el:e.def.el,col:DATA.EL[e.def.el].c,hostile:true});
            FX.ring(p.x,p.y,DATA.EL[e.def.el].c,10,70,0.7,4);
          } else if(e.def.atkType==='slam'){
            FX.ring(e.x,e.y,DATA.EL[e.def.el].c,10,reach+40,0.35,6);
            CAM.shake(6,0.2);
            if(U.dist(e.x,e.y,p.x,p.y)<reach+30) this.hurtPlayer(e.atk, e.def.el);
          } else {
            FX.slash(e.x,e.y-e.r*0.7,a,1.6,reach,DATA.EL[e.def.el].c,0.2,7);
            if(U.dist(e.x,e.y,p.x,p.y)<reach) this.hurtPlayer(e.atk, e.def.el);
          }
        }
      }
    }
    // чистка
    this.enemies=this.enemies.filter(e=>!e.dead);
  },

  spawnTick(dt){
    this.spawnT-=dt;
    if(this.spawnT>0) return;
    this.spawnT=1.6;
    const reg=MAP.regionAt(this.player.x,this.player.y);
    if(reg.safe) return;
    const alive=this.enemies.filter(e=>!e.dead).length;
    const cap=8;
    if(alive>=cap) return;
    // точка спавна в радиусе
    const near=MAP.spawns.filter(s=>s.region===reg.id &&
      U.dist(s.x,s.y,this.player.x,this.player.y)<1100 &&
      U.dist(s.x,s.y,this.player.x,this.player.y)>320);
    if(!near.length) return;
    const sp=U.choice(near);
    const type=U.choice(sp.types);
    const lvl=U.randi(sp.lvl[1],sp.lvl[0]);
    this.spawnEnemy(type, sp.x+U.rand(60,-60), sp.y+U.rand(60,-60), lvl);
    // боссы
    for(const b of MAP.bossSpots){
      if(G.save.bossKilled[b.id]) continue;
      if(U.dist(b.x,b.y,this.player.x,this.player.y)<420 && !this.boss){
        this.spawnEnemy(b.id,b.x,b.y,b.lvl,true,b.id);
        UI.toast('ОБНАРУЖЕН БОСС: '+DATA.ENEMIES[b.id].n,'warn');
        SFX.ult();
        CAM.shake(12,0.8);
      }
    }
  },

  /* ------------------------------------------------------------- отрисовка */
  draw(ctx,t){
    // зоны
    for(const z of this.zones){
      const k=z.t/z.dur, a=1-k;
      ctx.save();
      ctx.globalAlpha=0.25*a;
      const g=ctx.createRadialGradient(z.x,z.y,0,z.x,z.y,z.r);
      g.addColorStop(0,z.col); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.ellipse(z.x,z.y,z.r,z.r*0.55,0,0,6.2832); ctx.fill();
      ctx.globalAlpha=0.5*a; ctx.strokeStyle=z.col; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(z.x,z.y,z.r*0.95,z.r*0.52,0,0,6.2832); ctx.stroke();
      ctx.restore();
    }

    // враги
    for(const e of this.enemies){
      if(!CAM.visible(e.x,e.y,80)) continue;
      ART.drawEnemy(ctx,e,t);
      // телеграф атаки — сектор в сторону цели / круг для площадных
      if(e.wind>0){
        const elc=DATA.EL[e.def.el].c;
        const total=e.def.atkType==='slam'?0.75:e.def.ai==='ranged'?0.5:0.42;
        const k=1-U.clamp(e.wind/total,0,1);
        const reach=(e.def.ai==='brute'||e.def.ai==='boss')?e.r+95:e.r+55;
        ctx.save();
        if(e.def.atkType==='slam'||e.def.atkType==='aoe'){
          ctx.globalAlpha=0.08+k*0.14;
          ctx.fillStyle=elc;
          ctx.beginPath(); ctx.ellipse(e.x,e.y,e.r+95,e.r+58,0,0,6.2832); ctx.fill();
          ctx.globalAlpha=0.5+k*0.3;
          ctx.strokeStyle=elc; ctx.lineWidth=2; ctx.setLineDash([7,7]);
          ctx.beginPath(); ctx.ellipse(e.x,e.y,e.r+95,e.r+58,0,0,6.2832); ctx.stroke();
          ctx.setLineDash([]);
        } else {
          const a=U.ang(e.x,e.y,this.player.x,this.player.y);
          ctx.globalAlpha=0.10+k*0.16;
          ctx.fillStyle=elc;
          ctx.beginPath(); ctx.moveTo(e.x,e.y-8);
          ctx.arc(e.x,e.y-8,reach,a-0.5,a+0.5); ctx.closePath(); ctx.fill();
          ctx.globalAlpha=0.55+k*0.35; ctx.strokeStyle=elc; ctx.lineWidth=1.8;
          ctx.beginPath(); ctx.arc(e.x,e.y-8,reach,a-0.5,a+0.5); ctx.stroke();
        }
        ctx.restore();
      }
      // полоса HP
      if(e.hp<e.maxHp||e.boss||e.elite){
        const w=e.boss?170:Math.max(40,e.r*2.4), h=e.boss?7:5;
        const bx=e.x-w/2, by=e.y-(e.boss?e.r*2.8:e.r+30);
        ctx.fillStyle='rgba(0,0,0,.82)'; ctx.fillRect(bx-1.5,by-1.5,w+3,h+3);
        ctx.fillStyle='#3a0d10'; ctx.fillRect(bx,by,w,h);
        const elc=DATA.EL[e.def.el].c;
        ctx.fillStyle=elc;
        ctx.fillRect(bx,by,w*U.clamp(e.hp/e.maxHp,0,1),h);
        if(e.dazeMax&&e.daze>0){
          ctx.fillStyle='#ffb300';
          ctx.fillRect(bx,by+h+1.5,w*U.clamp(e.daze/e.dazeMax,0,1),2.5);
        }
        if(e.elite||e.boss){
          ctx.font='700 9px Consolas,monospace';
          ctx.textAlign='center'; ctx.fillStyle='#dfe6f2';
          ctx.fillText((e.elite?'ЭЛИТА ':'БОСС ')+'ур.'+e.lvl, e.x, by-5);
        }
      }
    }

    // снаряды
    for(const pr of this.projs){
      ctx.save();
      ctx.shadowColor=pr.col; ctx.shadowBlur=14;
      ctx.fillStyle=pr.col;
      ctx.beginPath(); ctx.arc(pr.x,pr.y,pr.r,0,6.2832); ctx.fill();
      ctx.fillStyle='#fff'; ctx.globalAlpha=.8;
      ctx.beginPath(); ctx.arc(pr.x,pr.y,pr.r*0.45,0,6.2832); ctx.fill();
      ctx.restore();
    }

    // подбираемое
    for(const k of this.pickups){
      const b=Math.sin(t*6+k.x)*3;
      ctx.save();
      ctx.shadowColor=k.col; ctx.shadowBlur=10;
      ctx.fillStyle=k.col;
      ctx.beginPath(); ctx.arc(k.x,k.y-10+b,4.5,0,6.2832); ctx.fill();
      ctx.restore();
    }

    // игрок
    const p=this.player;
    if(p&&!p.downed){
      const ch=this.char(), elc=DATA.EL[ch.el];
      // свет под ногами
      const lg=ctx.createRadialGradient(p.x,p.y,4,p.x,p.y,96);
      lg.addColorStop(0,U.rgba(elc.c,.20)); lg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=lg;
      ctx.beginPath(); ctx.ellipse(p.x,p.y,96,58,0,0,6.2832); ctx.fill();
      // кольцо-якорь
      ctx.strokeStyle=U.rgba(elc.c,.55); ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.ellipse(p.x,p.y,22,10,0,0,6.2832); ctx.stroke();
      ctx.strokeStyle=U.rgba(elc.c,.22); ctx.lineWidth=1;
      ctx.beginPath(); ctx.ellipse(p.x,p.y,30,14,0,0,6.2832); ctx.stroke();
      // шеврон над головой
      const bob=Math.sin(t*3)*3;
      ctx.fillStyle=elc.c;
      ctx.beginPath();
      ctx.moveTo(p.x,p.y-62+bob); ctx.lineTo(p.x-6,p.y-72+bob); ctx.lineTo(p.x+6,p.y-72+bob);
      ctx.closePath(); ctx.fill();
      // HP над головой
      const hpR=U.clamp(p.hp/(p.maxHp||1),0,1), bw=46;
      ctx.fillStyle='rgba(0,0,0,.78)';
      ctx.fillRect(p.x-bw/2-1.5,p.y-90,bw+3,7);
      ctx.fillStyle=hpR>0.5?'#3ef08a':hpR>0.25?'#ffb300':'#ff3b30';
      ctx.fillRect(p.x-bw/2,p.y-88.5,bw*hpR,4);
      if(p.shield>0){
        ctx.fillStyle='#9fd8ff';
        ctx.fillRect(p.x-bw/2,p.y-93,bw*U.clamp(p.shield/(p.maxHp*0.3),0,1),2);
      }
      p.attacking=this.player.attacking;
      ART.drawAgent(ctx,p,t);
      if(p.shield>0){
        ctx.strokeStyle='rgba(207,216,230,.65)'; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.arc(p.x,p.y-22,26,0,6.2832); ctx.stroke();
      }
    }
    FX.draw(ctx);
  },
};

</script>
<script>
/* ==== ui.js ==== */
/* ============================================================================
   НОЛЬ-СЕКТОР — ИНТЕРФЕЙС: HUD, древо навыков, гача, коллекция, магазин
   ========================================================================== */
'use strict';

/* ================================================================ ЗАКАЗЫ == */
const QM = {
  list:[
    { id:'q1', n:'Разгрести свалку', d:'Уничтожить 8 врагов в Ржавом Поясе',
      type:'killRegion', region:'rust', need:8, cr:600, eth:0, sp:1 },
    { id:'q2', n:'Не подходить к печи', d:'Уничтожить 12 врагов в Голодной Печи',
      type:'killRegion', region:'furnace', need:12, cr:1200, eth:40, sp:1 },
    { id:'q3', n:'Три ящика', d:'Открыть 3 любых сундука',
      type:'chest', need:3, cr:800, eth:0, sp:1 },
    { id:'q4', n:'Оглушить и добить', d:'Провести 10 стихийных реакций',
      type:'reaction', need:10, cr:900, eth:60, sp:1 },
    { id:'q5', n:'Печь должна остыть', d:'Победить босса ГОЛЕМ-ПЕЧЬ',
      type:'boss', boss:'golem', need:1, cr:3000, eth:200, sp:3 },
    { id:'q6', n:'Разлом не спит', d:'Победить НОЛЬ в Разломе',
      type:'boss', boss:'nullb', need:1, cr:8000, eth:500, sp:5 },
  ],
  q(id){ return G.save.quests[id] || (G.save.quests[id]={p:0,done:false,claimed:false}); },
  onKill(e){
    const reg=MAP.regionAt(e.x,e.y);
    for(const q of this.list){
      if(q.type!=='killRegion'||q.region!==reg.id) continue;
      const s=this.q(q.id);
      if(s.claimed) continue;
      s.p++;
      if(s.p>=q.need) s.done=true;
    }
    for(const q of this.list){
      if(q.type!=='boss'||q.boss!==e.bossId) continue;
      const s=this.q(q.id);
      s.p=1; s.done=true;
    }
  },
  onChest(){
    for(const q of this.list){
      if(q.type!=='chest') continue;
      const s=this.q(q.id);
      if(s.claimed) continue;
      s.p++; if(s.p>=q.need) s.done=true;
    }
  },
  onReaction(){
    for(const q of this.list){
      if(q.type!=='reaction') continue;
      const s=this.q(q.id);
      if(s.claimed) continue;
      s.p++; if(s.p>=q.need) s.done=true;
    }
  },
  claim(id){
    const q=this.list.find(x=>x.id===id), s=this.q(id);
    if(!s.done||s.claimed) return false;
    s.claimed=true;
    G.save.credits+=q.cr||0; G.save.eth+=q.eth||0; G.save.sp+=q.sp||0;
    return true;
  },
};

/* ================================================================== ГАЧА == */
const GACHA = {
  rollRarity(bannerId, pity, forceMin4){
    const b=DATA.GACHA.banners.find(x=>x.id===bannerId)||DATA.GACHA.banners[0];
    if(pity+1>=DATA.GACHA.hardPity) return 5;
    if(pity+1>=DATA.GACHA.softPity){
      const softRate=DATA.GACHA.rates[5]+(pity+1-DATA.GACHA.softPity)*0.06;
      if(Math.random()<softRate) return 5;
    }
    const r=Math.random();
    if(r<DATA.GACHA.rates[5]) return 5;
    if(r<DATA.GACHA.rates[5]+DATA.GACHA.rates[4]) return 4;
    return 3;
  },

  pickChar(rarity, bannerId){
    const b=DATA.GACHA.banners.find(x=>x.id===bannerId)||DATA.GACHA.banners[0];
    const owned=Object.keys(G.save.roster);
    if(rarity===5){
      const ups=(b.up||[]).map(id=>DATA.CHARS.find(c=>c.id===id)).filter(c=>c&&c.rarity===5);
      if(ups.length && Math.random()<0.6){
        return U.choice(ups);
      }
      const pool=DATA.CHARS.filter(c=>c.rarity===5);
      const fresh=pool.filter(c=>!owned.includes(c.id));
      if(fresh.length && Math.random()<0.5) return U.choice(fresh);
      return U.choice(pool);
    }
    const pool4=DATA.CHARS.filter(c=>c.rarity===4);
    const fresh4=pool4.filter(c=>!owned.includes(c.id));
    if(fresh4.length && Math.random()<0.62) return U.choice(fresh4);
    if(pool4.length) return U.choice(pool4);
    return null;
  },

  pull(bannerId, count){
    const b=DATA.GACHA.banners.find(x=>x.id===bannerId);
    const cost=count===10?DATA.GACHA.tenCost:DATA.GACHA.pullCost*count;
    if(G.save.eth<cost) return {err:'Недостаточно эфиритов'};
    G.save.eth-=cost;
    const out=[];
    let has4=false;
    for(let i=0;i<count;i++){
      const pid = bannerId==='lum'?'lum':'std';
      if(!G.save.pity[pid]) G.save.pity[pid]=0;
      let rar=this.rollRarity(pid,G.save.pity[pid]);
      if(count===10 && i===9 && !has4 && rar===3) rar=4;
      if(rar>=4) has4=true;
      G.save.pity[pid]= rar===5?0:G.save.pity[pid]+1;
      G.save.pulls.total=(G.save.pulls.total||0)+1;

      if(rar===3){
        const kind=Math.random()<0.5?'chip':'credits';
        const val=kind==='chip'?1:120;
        out.push({rar, kind, val});
      } else {
        const c=this.pickChar(rar,bannerId);
        if(!c){ out.push({rar:3,kind:'chip',val:2}); continue; }
        const isNew=!G.save.roster[c.id];
        if(isNew){
          G.save.roster[c.id]={level:1,xp:0,nodes:{},tiles:{basic:1,skill:1,dodge:1,chain:1},cinema:0};
          G.rt[c.id]={hp:CBT.stats(c.id).hp,dec:0};
          if(G.save.party.length<3) G.save.party.push(c.id);
        } else {
          const r=G.save.roster[c.id];
          r.cinema=Math.min(5,(r.cinema||0)+1);
          G.save.eth+=40;
        }
        out.push({rar, char:c, isNew, dupe:!isNew});
      }
    }
    G.save.stats.pulls=(G.save.stats.pulls||0)+count;
    Store.save();
    return {out};
  },
};

/* =================================================================== UI ==== */
const UI = {

      </div>
      <div class="act big ${p.dodgeCd>0?'':'ready'}"><span>РЫВОК</span><span class="k">ПРОБЕЛ</span></div>

      </div>

  refreshCombo(){
    const el=document.getElementById('combo');

  bindKeys(){

      }

      if(lv>=n.max) return 'owned';

      <div style="margin-top:auto;display:flex;gap:8px;padding-top:10px">

        <button class="btn ghost" onclick="UI.openRoster()">ВСЕ АГЕНТЫ</button>
      </div>
    `;
  },

  gearBody(c){
    const r=G.save.roster[c.id];
    const cin=r.cinema||0;
    const ranks=[
      ['I','«Первый дубль»', '+1% крит. шанса'],
      ['II','«Второй дубль»','+2% крит. шанса'],
      ['III','«Третий дубль»','+3% крит. шанса'],
      ['IV','«Четвёртый дубль»','+4% крит. шанса'],
      ['V','«Пятый дубль»','+5% крит. шанса'],
    ];
    return `
      <div style="display:flex;flex-direction:column;gap:8px">
        ${ranks.map((x,i)=>`
          <div class="si" style="opacity:${i<cin?1:0.4}">
            <div class="si-ic" style="color:${i<cin?'var(--yellow)':'#3a4152'}">★</div>
            <div class="si-m">
              <div class="si-n">КИНО ${x[0]} · ${x[1]}</div>
              <div class="si-d">${x[2]}</div>
            </div>
            <div style="font-size:10px;letter-spacing:1px;color:${i<cin?'var(--lime)':'var(--dim2)'}">
              ${i<cin?'ОТКРЫТО':'ЗАКРЫТО'}</div>
          </div>`).join('')}
      </div>
      <div style="margin-top:12px;padding:12px;background:#0e1015;border:1px solid #262b38;
        font-size:11.5px;color:var(--dim);line-height:1.6">
        Кино-ранги открываются при выпадении дублей агента в канале.<br>
        Дубли также дают <b style="color:var(--yellow)">+40 эфиритов</b> каждый.
      </div>
    `;
  },

  selNode(k){
    SFX.ui();
    this.nodeSel=k;
    const c=DATA.CHARS.find(x=>x.id===this.agentId);
    const n=c.tree[k], r=G.save.roster[c.id];
    const lv=(r.nodes&&r.nodes[k])||0;
    const maxed=lv>=n.max;
    const cost=maxed?0:n.cost[lv];
    const owned=['A','B','C','D','E','F'].filter(x=>(r.nodes[x]||0)>0).length;
    const avail = !n.req.length ? true
      : n.req[0]==='3nodes' ? owned>=3
      : n.req.every(x=>(r.nodes[x]||0)>0);
    const box=document.getElementById('nodeinfo');
    if(!box) return;
    box.innerHTML=`<div class="nodeinfo">
      <div class="ni-h">
        <div class="ni-t">${n.name}</div>
        <div class="ni-l">${lv}/${n.max}</div>
      </div>
      <div class="ni-d">${n.d}</div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:11px">
        <span class="tag">${n.core?'ЯДРО':'УЗЕЛ'}</span>
        <span class="mono" style="color:var(--lime)">${maxed?'МАКС':cost+' SP'}</span>
      </div>
      <button class="btn" ${maxed||!avail?'disabled':''}
        onclick="UI.upNode('${k}')">
        ${maxed?'ИЗУЧЕНО':!avail?'НУЖНЫ ПРЕДЫДУЩИЕ УЗЛЫ':`ИЗУЧИТЬ · ${cost} SP`}</button>
    </div>`;
  },

  upNode(k){
    const c=DATA.CHARS.find(x=>x.id===this.agentId);
    const n=c.tree[k], r=G.save.roster[c.id];
    const lv=(r.nodes&&r.nodes[k])||0;
    if(lv>=n.max) return;
    const cost=n.cost[lv];
    if(G.save.sp<cost){ UI.toast('Не хватает SP','warn'); return; }
    G.save.sp-=cost;
    r.nodes[k]=lv+1;
    SFX.levelup();
    const b=document.querySelector(`.node[data-k="${k}"]`);
    if(b){ b.style.transform='scale(1.18)'; setTimeout(()=>b.style.transform='',180); }
    Store.save();
    this.openAgent(c.id);
    this.selNode(k);
  },

  upTile(id){
    const c=DATA.CHARS.find(x=>x.id===this.agentId);
    const r=G.save.roster[c.id];
    r.tiles=r.tiles||{basic:1,skill:1,dodge:1,chain:1};
    const lv=r.tiles[id]||1;
    if(lv>=8) return;
    const cost=this.tileCost(lv);
    if(G.save.chips<cost.chip || G.save.credits<cost.cr){
      UI.toast('Нужно '+cost.chip+' чипов и '+cost.cr+' кредитов','warn'); return;
    }
    G.save.chips-=cost.chip; G.save.credits-=cost.cr;
    r.tiles[id]=lv+1;
    SFX.levelup();
    Store.save();
    this.openAgent(c.id);
  },

  addParty(id){
    const p=G.save.party;
    if(p.includes(id)){ UI.toast('Уже в отряде','warn'); return; }
    if(p.length>=3){ UI.toast('Отряд полон: уберите агента','warn'); this.openRoster(); return; }
    p.push(id);
    if(CBT.party && !CBT.party.includes(id)) CBT.party.push(id);
    G.rt[id]=G.rt[id]||{hp:CBT.stats(id).hp,dec:0};
    SFX.uiBig(); Store.save(); this.openRoster();
  },

  removeParty(id){
    if(G.save.party.length<=1) return;
    const i=G.save.party.indexOf(id);
    if(i<0) return;
    G.save.party.splice(i,1);
    if(CBT.party){ const j=CBT.party.indexOf(id); if(j>=0) CBT.party.splice(j,1); }
    CBT.active=0; CBT.syncActive(true);
    SFX.ui(); Store.save(); this.openRoster();
  },

  /* ======================================================= КОЛЛЕКЦИЯ ===== */
  openRoster(){
    const ids=Object.keys(G.save.roster);
    const cards=ids.map(id=>{
      const c=DATA.CHARS.find(x=>x.id===id);
      const r=G.save.roster[id];
      const el2=DATA.EL[c.el];
      const inP=G.save.party.includes(id);
      return `<div class="rc ${inP?'inparty':''}" onclick="UI.pickAgent('${id}')">
        <div class="re">${el2.g}</div>
        <div class="rl" style="color:${c.rarity===5?'#ffe600':'#c9a6ff'}">${'★'.repeat(c.rarity)}</div>
        <div class="rf">${ART.figure(c)}</div>
        <div class="rn">${c.name}</div>
        <div class="rr">${DATA.ROLES[c.role].n} · ур.${r.level}</div>
        ${inP?'<div class="pk">В ОТРЯДЕ</div>':''}
      </div>`;
    }).join('');
    const locked=DATA.CHARS.filter(c=>!ids.includes(c.id)).map(c=>`
      <div class="rc lockedc"><div class="rf">${ART.figure(c)}</div>
        <div class="rn">???</div><div class="rr">НЕ ОТКРЫТ</div></div>`).join('');

    this.mount('scr-roster',`
      ${this.head('Агенты · коллекция')}
      <div style="padding:0 24px 8px;display:flex;justify-content:space-between;align-items:center">
        <div class="sub">ОТКРЯД ${G.save.party.length}/3</div>
        <div class="muted">Клик — выбрать · ПКМ — убрать из отряда</div>
      </div>
      <div class="roster">${cards}${locked}</div>
      <div class="tabs" style="padding-bottom:18px">
        <div class="tab" onclick="UI.openAgent(G.save.party[0])">ДРЕВО НАВЫКОВ</div>
        <div class="tab on">КОЛЛЕКЦИЯ</div>
        <div class="tab" onclick="UI.openGacha()">КАНАЛ</div>
      </div>
    `);
    GAME.paused=true;
    this.el.querySelectorAll('.rc').forEach(rc=>{
      rc.addEventListener('contextmenu',e=>{
        e.preventDefault();
        const id=e.currentTarget.getAttribute('onclick').match(/'(\w+)'/)[1];
        UI.removeParty(id);
      });
    });
  },

  pickAgent(id){
    const p=G.save.party;
    if(p.includes(id)) this.openAgent(id);
    else this.addParty(id);
  },

        <div class="banner-art">
          <div class="rays"></div>
          <div class="banner-fig">${ART.figure(fullArt)}</div>

            <div class="bn3">${b.desc}<br>

          <div class="rate"><span>A-ранг · агент</span><b>5.1%</b></div>
          <div class="rate"><span>Материалы</span><b>94.3%</b></div>

            <div class="costln" style="margin-top:4px"><span>Баланс</span>
              <span class="mono" style="color:var(--yellow)">✦ ${G.save.eth}</span></div>
          </div>

  doPull(n){
    const res=GACHA.pull(this.banner,n);
    if(res.err){ UI.toast(res.err,'warn'); return; }
    SFX.gacha(5);
    // сначала проигрываем звук максимальной редкости
    const best=Math.max(...res.out.map(o=>o.rar));
    SFX.gacha(best);
    this.showResults(res.out);
  },

  showResults(out){
    const cards=out.map((o,i)=>{
      const delay=(i*0.07).toFixed(2);
      if(o.rar===3){
        return `<div class="card r3" style="animation-delay:${delay}s">
          <div style="position:absolute;inset:0;display:grid;place-items:center;font-size:40px;
            color:${o.kind==='chip'?'#c8ff1e':'#bfc9d8'}">${o.kind==='chip'?'▣':'◈'}</div>
          <div class="cn">${o.kind==='chip'?'Чип ×'+o.val:'Кредиты '+o.val}</div>
          <div class="sr">★★★</div></div>`;
      }
      const c=o.char;
      return `<div class="card r${o.rar} ${o.dupe?'dupe':''}" style="animation-delay:${delay}s">
        <div class="cf">${ART.figure(c)}</div>
        <div class="cb"></div>
        <div class="ce" style="background:${U.rgba(DATA.EL[c.el].c,.25)};color:${DATA.EL[c.el].c}">${DATA.EL[c.el].g}</div>
        <div class="sr">${'★'.repeat(o.rar)}</div>
        <div class="cn">${c.name}</div>
        ${o.dupe?'<div class="dup">ДУБЛЬ · +РАНГ</div>':''}
      </div>`;

    this.mount('scr-pull',`
      <div class="scr-head">
        <button class="back" onclick="UI.openGacha()">↩</button>
        <div class="crumb">Результат канала</div>
        <div style="flex:1"></div>
        <div class="muted">${out.length} круток</div>
      </div>
      <div class="pullgrid">${cards}</div>
      <div class="tabs" style="justify-content:center;padding-bottom:22px">
        <div class="tab" onclick="UI.doPull(10)">ЕЩЁ ×10</div>
        <div class="tab on" onclick="UI.openGacha()">НАЗАД</div>
      </div>
    `);
    GAME.paused=true;
  },

  /* ================================================================ МАГАЗИН */
  openShop(){
    const items=DATA.SHOP.map(it=>{
      const bal=it.cur==='cr'?G.save.credits:G.save.eth;
      const can=bal>=it.price;
      return `<div class="si">
        <div class="si-ic" style="color:${it.cur==='cr'?'#bfc9d8':'#ffe14d'}">${it.ic}</div>
        <div class="si-m">
          <div class="si-n">${it.n}</div>
          <div class="si-d">${it.d}</div>
        </div>
        <button class="btn ${can?'':'ghost'}" ${can?'':'disabled'}
          onclick="UI.buy('${it.id}')">${it.price} ${it.cur==='cr'?'КР':'ЭФ'}</button>
      </div>`;
    }).join('');
    this.mount('scr-shop',`
      ${this.head('Магазин · Ржавый рынок')}
      <div style="padding:0 24px 10px"><div class="sub">ТОВАРЫ</div></div>
      <div class="shop">${items}
        <div class="si" style="grid-column:1/-1;border-color:#333">
          <div class="si-ic">▤</div>
          <div class="si-m"><div class="si-n">Чипы: ${G.save.chips}</div>
            <div class="si-d">Материал для прокачки категорий навыков</div></div>
          <button class="btn ghost" onclick="UI.dailyBonus()">ЗАБРАТЬ ДНЕВНОЙ БОНУС</button>
        </div>
      </div>
    `);
    GAME.paused=true;
  },

  buy(id){
    const it=DATA.SHOP.find(x=>x.id===id);
    const bal=it.cur==='cr'?G.save.credits:G.save.eth;
    if(bal<it.price){ UI.toast('Недостаточно средств','warn'); return; }
    if(it.cur==='cr') G.save.credits-=it.price; else G.save.eth-=it.price;
    if(it.give.chip) G.save.chips+=it.give.chip;
    if(it.give.eth) G.save.eth+=it.give.eth;
    if(it.give.sp) G.save.sp+=it.give.sp;
    if(it.give.heal){
      for(const cid of G.save.party){
        const s=CBT.stats(cid); G.rt[cid].hp=s.hp;
      }
      UI.toast('Команда восстановлена','gold');
    }
    SFX.pickup(); Store.save(); this.openShop(); this.refreshRes();
  },

  dailyBonus(){
    const k='bonus:'+new Date().toDateString();
    if(G.save.flags[k]){ UI.toast('Сегодня уже забрано','warn'); return; }
    G.save.flags[k]=true;
    G.save.eth+=160; G.save.chips+=2; G.save.credits+=500;
    UI.toast('Бонус: ✦160 · 2 чипа · 500 КР','gold');
    SFX.levelup(); Store.save(); this.openShop();
  },

  openQuests(){
    const rows=QM.list.map(q=>{
      const s=QM.q(q.id);
      const pct=U.clamp(s.p/q.need,0,1)*100;
      const can=s.done&&!s.claimed;
      return `<div class="si" style="align-items:flex-start">
        <div class="si-ic" style="color:${s.claimed?'#3a4152':can?'var(--lime)':'#8b91a3'}">

        <div class="si-m">
          <div class="si-n">${q.n}</div>
          <div class="si-d">${q.d}</div>
          <div class="bar" style="height:4px;margin-top:7px;width:220px">
            <i style="width:${pct}%;background:${can?'linear-gradient(90deg,#ffe600,#c8ff1e)':'#4a5568'}"></i></div>
          <div style="font-size:10px;color:var(--dim2);margin-top:4px" class="mono">
            ${Math.min(s.p,q.need)} / ${q.need} · награда: ${q.cr}КР${q.eth?' · ✦'+q.eth:''}${q.sp?' · '+q.sp+'SP':''}</div>
        </div>
        <button class="btn ${can?'':'ghost'}" ${can?'':'disabled'}

      </div>`;
    }).join('');
    this.mount('scr-quests',`
      ${this.head('Доска заказов · Диспетчер')}
      <div style="padding:0 24px 10px"><div class="sub">КОНТРАКТЫ</div></div>
      <div class="shop">${rows}</div>

        <button class="btn ${unlocked?'':'ghost'}" ${unlocked?'':'disabled'}

      <div class="shop">${regs}</div>
    `);

  /* ================================================================ ДИАЛОГ */
  dialog(npc,onEnd){
    const lines=npc.npc?npc.npc.lines:npc.lines;
    const name=npc.npc?npc.npc.name:npc.name;
    let i=0;
    const show=()=>{
      const d=document.getElementById('dlg');
      if(!d) return;
      d.querySelector('.dt').textContent=lines[i];
      d.querySelector('.dc').textContent=(i+1)+' / '+lines.length+' · клик — далее';
    };
    this.el.innerHTML=`<div class="dlg" id="dlg" onclick="UI._nextLine()">
      <div class="dp"><div style="width:100%;height:100%;display:grid;place-items:center;
        font-family:Impact;font-size:26px;color:var(--lime)">${name[0]}</div></div>
      <div style="flex:1">
        <div class="dn">${name}</div>
        <div class="dt">${lines[0]}</div>
      </div>
      <div class="dc"></div>
    </div>`;
    this.cur='dialog';
    this._dlg={lines,i:0,npc,onEnd,show};
    show();
    SFX.uiBig();
  },
  _nextLine(){
    const d=this._dlg;
    if(!d) return;
    d.i++;
    if(d.i>=d.lines.length){
      this.el.innerHTML=''; this.cur=null; this._dlg=null;
      if(d.onEnd) d.onEnd();
      return;
    }
    d.show();
    SFX.ui();
  },
};

/* ================================================================ ТИТУЛ === */
const TITLE = {
  open(){
    const hasSave=Store.has();
    UI.mount('scr-title',`
      <div class="center-col">
        <div class="sub">НОВЫЙ ЭРИДУ… ШУТКА. КАЙРОС.</div>
        <div class="big-title">НОЛЬ<br>СЕКТОР</div>
        <div style="font-size:13px;letter-spacing:4px;color:var(--dim);margin-top:-6px">
          ЭКШЕН-ГАЧА · СТИХИЙНЫЕ РЕАКЦИИ · ДРЕВО НАВЫКОВ</div>
        <div class="menu-btns">
          <button class="btn" id="startBtn" onclick="TITLE.start(${hasSave})">
            ${hasSave?'ПРОДОЛЖИТЬ':'НАЧАТЬ'}</button>
          ${hasSave?`<button class="btn ghost" onclick="TITLE.newGame()">НОВАЯ ИГРА</button>`:''}
          <button class="btn ghost" onclick="UI.openMenu()">УПРАВЛЕНИЕ</button>
        </div>
        <div class="hintline">
          Пять районов, десять стихийных реакций, комбо через смену агента.<br>
          <span style="color:var(--lime)">Совет:</span> бей одним элементом, добивай другим — реакция даёт больше урона, чем удар.
        </div>
      </div>
    `);
    GAME.paused=true;
  },
  start(hasSave){
    SFX.init(); SFX.resume(); SFX.setMood(110);
    if(hasSave && Store.load()){
      Object.assign(G.save, Store.load().save||{});
    }
    UI.close();
    GAME.paused=false;
    GAME.started=true;
    if(!G.save.seen.intro){
      G.save.seen.intro=true;
      setTimeout(()=>{
        UI.dialog({name:'ДИСПЕТЧЕР', lines:[
          'Добро пожаловать в Ноль-сектор, courier.',
          'Дыра в небе растёт. Пока ты читаешь это, она съела ещё два квартала.',
          'Правило простое: наложи стихию, смени агента, добей реакцией. Один удар — ноль. Реакция — всё.',
          'Иди в Ржавый Пояс. Там уже шумит. W A S D — и вперёд.',
        ]}, ()=>{});
      }, 700);
    }
    UI.refreshTeam();
  },
  newGame(){
    Store.wipe();
    G.init();
    TITLE.start(false);
  },
};

</script>
<script>
/* ==== main.js ==== */
/* ============================================================================
   НОЛЬ-СЕКТОР — ГЛАВНЫЙ ЦИКЛ: состояние, сцены, взаимодействия, отрисовка
   ========================================================================== */
'use strict';

/* ============================================================ СОСТОЯНИЕ === */
const G = {
  save:null,
  rt:{},
  init(){
    this.save={
      credits:3600, eth:3200, chips:8, sp:6,
      party:['volt','iney','pepel'],
      roster:{
        volt:{level:6,xp:0,nodes:{},tiles:{basic:1,skill:1,dodge:1,chain:1},cinema:0},
        iney:{level:5,xp:0,nodes:{},tiles:{basic:1,skill:1,dodge:1,chain:1},cinema:0},
        pepel:{level:5,xp:0,nodes:{},tiles:{basic:1,skill:1,dodge:1,chain:1},cinema:0},
      },
      world:{x:48,y:20},
      unlockedTP:['hub'],
      bossKilled:{},
      quests:{},
      pulls:{total:0},
      pity:{std:0,lum:0},
      flags:{},
      seen:{intro:false},
      stats:{kills:0,reactions:0,bosses:0,deaths:0,pulls:0},
    };
    this.rt={};
    for(const id of Object.keys(this.save.roster)){
      const s=CBT.statsOutside?CBT.statsOutside(id):null;
      this.rt[id]={hp:99999,dec:0,cd:0};
    }
    // hp выставим после первого расчёта статов
    this.fixRuntimes();
  },
  fixRuntimes(){
    for(const id of Object.keys(this.save.roster)){
      if(!this.rt[id]) this.rt[id]={hp:1,dec:0,cd:0};
      const st=CBT.stats(id);
      if(!isFinite(this.rt[id].hp)||this.rt[id].hp>st.hp||this.rt[id].hp<1)
        this.rt[id].hp=st.hp;
    }
  },
  loadFrom(data){
    if(!data||!data.save) return false;
    this.save=Object.assign(this.save,data.save);
    this.rt=data.rt||{};
    for(const id of Object.keys(this.save.roster)) if(!this.rt[id]) this.rt[id]={hp:1,dec:0};
    return true;
  },
};

/* ================================================================ ИГРА ==== */
const GAME = {
  t:0, last:0, paused:true, started:false,
  hudT:0, region:null, promptObj:null, mm:null, mmx:null,
  nearObj:null,

  boot(){
    ENG.init();
    INPUT.init();
    G.init();
    MAP.build();
    MAP.props.sort((a,b)=>a.y-b.y);
    CBT.init();
    G.fixRuntimes();
    CBT.syncActive(true);
    UI.init();
    // миникарта
    this.mm=document.getElementById('minimap');
    if(this.mm){ this.mm.width=184; this.mm.height=184; this.mmx=this.mm.getContext('2d'); }
    // погода по региону
    const reg=MAP.regionAt(CBT.player.x,CBT.player.y);
    WEATHER.init(reg.weather);
    SFX.setMood(130);
    CAM.follow(CBT.player.x,CBT.player.y,1,true);
    TITLE.open();
    this.last=performance.now();
    // основной цикл: rAF + резервный таймер (для вкладок, где rAF заморожен)
    const step=(now)=>{ this.tick(now); requestAnimationFrame(step); };
    requestAnimationFrame(step);
    setInterval(()=>{
      if(performance.now()-this.last>180) this.tick(performance.now());
    }, 60);
  },

  tick(now){
    if(this._inTick) return;
    this._inTick=true;
    try{ this.loop(now); } finally { this._inTick=false; }
  },

  loop(now){
    const dtRaw=U.clamp((now-this.last)/1000,0,0.05);
    this.last=now;
    this.t+=dtRaw;
    if(!this.paused && this.started){
      const dt=dtRaw*(CBT.slowmo>0?0.33:1);
      CBT.update(dt);
      WEATHER.update(dtRaw);
      this.checkRegion();
      this.checkInteract();
      this.checkPads();
      CAM.follow(CBT.player.x,CBT.player.y+8,dtRaw);
      SFX.tickMusic(dtRaw);
    } else {
      // лёгкая анимация мира в меню
      CAM.follow(CBT.player.x,CBT.player.y,0.05);
      WEATHER.update(dtRaw*0.5);
    }
    CAM.update(dtRaw);
    this.render(dtRaw);
    this.renderHUD(dtRaw);
    INPUT.endFrame();
  },

  checkRegion(){
    const reg=MAP.regionAt(CBT.player.x,CBT.player.y);
    if(reg!==this.region){
      this.region=reg;
      WEATHER.init(reg.weather);
      SFX.setMood(reg.id==='hub'?130:reg.id==='rust'?110:reg.id==='furnace'?98:
                  reg.id==='cryo'?146:87);
      UI.toast('◈ '+reg.name+' · '+(reg.safe?'безопасная зона':'ур. '+reg.lvl[0]+'–'+reg.lvl[1]),'gold');
      this.showQuest();
    }
  },

  checkPads(){
    for(const p of MAP.pads){
      if(G.save.unlockedTP.includes(p.id)) continue;
      if(U.dist(p.x,p.y,CBT.player.x,CBT.player.y)<50){
        G.save.unlockedTP.push(p.id);
        UI.toast('Точка перемещения открыта: '+p.n,'gold');
        SFX.levelup(); Store.save();
      }
    }
  },

  checkInteract(){
    let best=null, bd=76;
    for(const o of MAP.objs){
      const d=U.dist(o.x,o.y,CBT.player.x,CBT.player.y);
      if(d<bd){ bd=d; best=o; }
    }
    this.nearObj=best;
    const hint=document.getElementById('hint');
    if(hint){
      if(best){
        const label = best.t==='chest'?'открыть сундук':
          best.t==='terminal'?'открыть канал':
          best.t==='shop'?'магазин':
          best.t==='board'?'доска заказов':
          best.t==='save'?'сохранить':
          'поговорить';
        hint.innerHTML=`<b style="color:var(--lime)">R</b> — ${label}`;
        hint.style.color='#dfe6f2';
      } else {
        hint.innerHTML='WASD — движение · ЛКМ/J — удар · E — навык · Пробел — рывок · Q — ульта · 1/2/3 — смена';
        hint.style.color='';
      }
    }
    if(best && INPUT.hit('KeyR')) this.interact(best);
  },

  interact(o){
    if(o.t==='chest'){
      if(o.opened){ UI.toast('Сундук пуст','warn'); return; }
      o.opened=true;
      const r=o.reward;
      G.save.credits+=r.cr||0;
      G.save.eth+=r.eth||0;
      G.save.chips+=r.chip||0;
      FX.burst(o.x,o.y-20,'#c8ff1e',26,320);
      FX.ring(o.x,o.y,'#c8ff1e',10,90,0.5,4);
      SFX.pickup();
      UI.toast(`Сундук: ${r.cr||0} КР · ${r.eth?r.eth+' ЭФ · ':''}${r.chip?r.chip+' чипов':''}`,'gold');
      QM.onChest(); Store.save(); UI.refreshRes();
    }
    else if(o.t==='terminal') UI.openGacha();
    else if(o.t==='shop') UI.openShop();
    else if(o.t==='board') UI.openQuests();
    else if(o.t==='save'){ Store.save(); UI.toast('Прогресс сохранён','gold'); SFX.uiBig(); }
    else if(o.t==='npc'){
      if(o.npc.hook){ o.npc.hook(); return; }
      UI.dialog(o, ()=>{});
    }
  },

  showQuest(){
    const el=document.getElementById('questpad');
    if(!el) return;
    const q=QM.list.find(q=>{const s=QM.q(q.id);return !s.claimed;});
    if(!q){ el.innerHTML=''; return; }
    const s=QM.q(q.id);
    el.innerHTML=`<div id="quest">
      <div class="qt">Активный заказ</div>
      <div class="qd">${q.n}</div>
      <div class="qo">${q.d} · ${Math.min(s.p,q.need)}/${q.need}</div>
    </div>`;
  },

  /* ------------------------------------------------------------- рендер -- */
  render(dt){
    const ctx=ENG.ctx, W=ENG.W, H=ENG.H;
    const reg=this.region||MAP.regionAt(CBT.player.x,CBT.player.y);
    ctx.setTransform(ENG.dpr,0,0,ENG.dpr,0,0);
    // фон
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,reg.sky||'#0b0c10');
    bg.addColorStop(1,'#05060a');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    CAM.zoom=U.clamp(Math.min(W,H)/540,1.0,1.7);
    ctx.save();
    CAM.apply(ctx);

    const cam={x:CAM.x,y:CAM.y,w:W/CAM.zoom,h:H/CAM.zoom};
    MAP.drawTerrain(ctx,cam,this.t);

    // объекты станций (под всеми)
    MAP.drawObjects(ctx,this.t);

    const p=CBT.player;
    const py=p?p.y:0;

    // реквизит позади игрока
    for(const pr of MAP.props){
      if(pr.y<py) { if(CAM.visible(pr.x,pr.y,120)) MAP.drawProp(ctx,pr,this.t); }
    }

    // бой
    CBT.draw(ctx,this.t);

    // реквизит впереди
    for(const pr of MAP.props){
      if(pr.y>=py) { if(CAM.visible(pr.x,pr.y,120)) MAP.drawProp(ctx,pr,this.t); }
    }

    // босс-бар
    if(CBT.boss && !CBT.boss.dead){
      const b=CBT.boss;
      ctx.save();
      ctx.fillStyle='rgba(8,9,12,.82)';
      ctx.fillRect(W/2-260,26,520,34);
      ctx.fillStyle='#ff3b30';
      ctx.fillRect(W/2-256,26+22,512*U.clamp(b.hp/b.maxHp,0,1),8);
      ctx.fillStyle='#fff';
      ctx.font='16px Impact, sans-serif'; ctx.textAlign='center';
      ctx.fillText(b.def.n+' · ур.'+b.lvl, W/2, 26+16);
      ctx.restore();
    }

    // анимация ульты
    if(CBT.ultFx){
      const k=CBT.ultFx.t/1.3;
      ctx.save();
      ctx.globalAlpha=Math.max(0,1-k)*0.9;
      ctx.fillStyle=CBT.ultFx.char.art.accent;
      ctx.fillRect(-2000,-2000,6000,6000);
      ctx.restore();
    }
    ctx.restore();

    // погода поверх мира
    WEATHER.draw(ctx);

    // вспышка
    if(CBT.flash>0){
      ctx.save();
      ctx.globalAlpha=U.clamp(CBT.flash,0,1)*0.5;
      ctx.fillStyle=CBT.flashCol;
      ctx.fillRect(0,0,W,H);
      ctx.restore();
    }
    // рамка/виньетка
    drawVignette(ctx,W,H,reg.safe?'#0a1420':'#1a0a0a',0.52);
    drawScanlines(ctx,W,H);

    // затемнение под меню
    if(this.paused){
      ctx.save();
      ctx.globalAlpha=.35; ctx.fillStyle='#05060a'; ctx.fillRect(0,0,W,H);
      ctx.restore();
    }
    // кастомный курсор-прицел
    if(!this.paused){
      const mx=INPUT.mouse.x, my=INPUT.mouse.y;
      ctx.save();
      ctx.strokeStyle='rgba(200,255,30,.75)'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(mx,my,7,0,6.2832); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(mx-12,my); ctx.lineTo(mx-4,my);
      ctx.moveTo(mx+4,my); ctx.lineTo(mx+12,my);
      ctx.moveTo(mx,my-12); ctx.lineTo(mx,my-4);
      ctx.moveTo(mx,my+4); ctx.lineTo(mx,my+12); ctx.stroke();
      ctx.restore();
    }
  },

  renderHUD(dt){
    if(!this.started||this.paused) return;
    this.hudT-=dt;
    if(this.hudT>0) return;
    this.hudT=0.08;
    UI.refreshTeam();
    UI.refreshRes();
    UI.refreshActs();
    UI.refreshCombo();
    if(this.mmx){
      this.mmx.clearRect(0,0,184,184);
      MAP.minimap(this.mmx,0,0,184,184,CBT.player);
    }
  },
};

/* ================================================================ СТАРТ === */
addEventListener('DOMContentLoaded',()=>{
  try{
    GAME.boot();
  }catch(e){
    console.error(e);
    document.body.innerHTML=`<div style="padding:40px;font-family:Consolas;color:#ff5a5a;white-space:pre-wrap">
ОШИБКА ЗАГРУЗКИ:\n${e && e.stack || e}</div>`;
  }
});

/* отладочный хук для проверки */
window.__game={
  state:()=>({paused:GAME.paused, started:GAME.started, region:GAME.region&&GAME.region.id,
    enemies:CBT.enemies.length, party:CBT.party, active:CBT.active,
    hp:CBT.player&&CBT.player.hp, credits:G.save.credits, eth:G.save.eth}),
  give:(n)=>{G.save.eth+=n;G.save.credits+=n;UI.refreshRes();return G.save.eth;},
  spawn:(type,x,y,lvl)=>{const e=CBT.spawnEnemy(type,x||CBT.player.x+120,y||CBT.player.y,lvl||5);
    return e?e.hp:null;},
  tp:(x,y)=>{CBT.player.x=x*MAP.ts;CBT.player.y=y*MAP.ts;CAM.follow(CBT.player.x,CBT.player.y,1,true);return true;},
  god:()=>{CBT.player.invuln=9999;return true;},
  setDec:(v)=>{CBT.rt().dec=v;return CBT.rt().dec;},
  openAgent:(id)=>UI.openAgent(id||G.save.party[0]),
  openGacha:()=>UI.openGacha(),
  closeMenu:()=>UI.close(),
  start:()=>{GAME.paused=false;GAME.started=true;UI.close();},
  friends:()=>CBT.enemies.map(e=>({t:e.type,hp:Math.round(e.hp)})),
};

</script>
